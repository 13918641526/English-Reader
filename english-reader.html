<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>划读 · 英语阅读器</title>
<style>
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#2a2a28; --muted:#8a8579;
  --line:#e5e0d5; --brand:#1f3a5f; --brand-soft:#eaf0f8;
  --vocab:#f6cf62; --vocab-bg:#fff2c4;
  --sentence:#7db4ec; --sentence-bg:#dbeafb;
  --question:#f08b7e; --question-bg:#ffe0da;
  --phrase:#a98bd6; --phrase-bg:#f0e9fb;
  --shadow:0 2px 18px rgba(60,50,30,.07);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
.hidden{display:none !important}

/* ---------- 顶栏 ---------- */
.topbar{height:60px;background:var(--brand);color:#fff;display:flex;align-items:center;
  gap:22px;padding:0 20px;position:sticky;top:0;z-index:30}
.brand{font-size:19px;font-weight:700;letter-spacing:2px;white-space:nowrap}
.brand span{font-size:11px;font-weight:400;letter-spacing:1px;opacity:.6;margin-left:8px}
.topbar .spacer{flex:1}
.group{display:flex;align-items:center;gap:6px}
.group-label{font-size:11px;opacity:.55;margin-right:4px;white-space:nowrap}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:7px;padding:3px}
.seg button{border:0;background:transparent;color:rgba(255,255,255,.72);font-size:12px;
  padding:6px 11px;border-radius:5px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand);font-weight:600}
.pens{display:flex;gap:5px}
.pens button{border:1px solid rgba(255,255,255,.25);background:transparent;color:rgba(255,255,255,.8);
  font-size:12px;padding:6px 10px;border-radius:6px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pens button.on{background:#fff;color:var(--brand);border-color:#fff;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.vocab{background:var(--vocab)} .dot.sentence{background:var(--sentence)}
.dot.question{background:var(--question)} .dot.phrase{background:var(--phrase)}
.tbtn{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;font-size:12px;
  padding:7px 12px;border-radius:6px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.12)}
/* 备考模式选择器 */
.topbar select.exam-sel{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);
  font-size:12px;padding:6px 8px;border-radius:6px;max-width:110px;cursor:pointer}
.topbar select.exam-sel option{color:var(--ink);background:#fff}

/* ---------- 布局 ---------- */
.layout{display:flex;height:calc(100vh - 60px);overflow:hidden}
.reader-wrap{flex:1;min-width:0;overflow-y:auto;padding:26px 28px 60px}
.side{width:390px;flex:none;background:#fbfaf6;border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}

/* ---------- 纸张 ---------- */
.docbar{max-width:820px;margin:0 auto 14px;display:flex;align-items:center;gap:10px;
  font-size:12px;color:var(--muted);flex-wrap:wrap}
.docbar select,.docbar button{border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:12px;padding:6px 10px;border-radius:6px}
.docbar button:hover{border-color:var(--brand)}
.docbar .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.paper{max-width:820px;margin:0 auto;background:var(--paper);position:relative;
  box-shadow:var(--shadow);border:1px solid #ece7dc;border-radius:3px;
  padding:52px 60px 64px;min-height:600px}
.paper:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#e8e2d4,#f3eee2)}
.paper h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1.3;
  margin:0 0 8px;font-weight:600;letter-spacing:.3px}
.paper .sub{font-size:12px;color:var(--muted);margin-bottom:34px;letter-spacing:.5px}
.paper p{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
  font-size:var(--fs,18px);line-height:1.95;color:#2e2d2a;margin:0 0 20px;
  text-align:justify;hyphens:auto}
.paper p.first:first-letter{font-size:2.1em;float:left;line-height:.9;padding:6px 8px 0 0;font-weight:600}
.w{border-radius:3px;padding:1px 0;transition:background .15s}
.w.hl{cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.w.hl-vocab{background:var(--vocab-bg);box-shadow:inset 0 -2px 0 rgba(246,207,98,.65)}
.w.hl-sentence{background:var(--sentence-bg);box-shadow:inset 0 -2px 0 rgba(125,180,236,.6)}
.w.hl-question{background:var(--question-bg);box-shadow:inset 0 -2px 0 rgba(240,139,126,.6)}
.w.hl-phrase{background:var(--phrase-bg);box-shadow:inset 0 -2px 0 rgba(169,139,214,.6)}
.w.flash{outline:2px solid var(--brand);outline-offset:2px}
/* 划完待分类的临时高亮 */
.w.pending{background:#eceae3;box-shadow:inset 0 -2px 0 rgba(120,115,100,.35)}
/* 就地询问气泡 */
#askPop{position:fixed;z-index:60;background:#fff;border:1px solid #ddd6c8;border-radius:10px;
  box-shadow:0 10px 30px rgba(40,35,20,.18);padding:9px;display:flex;gap:7px;align-items:center}
#askPop .lead{font-size:11px;color:var(--muted);padding:0 4px;white-space:nowrap}
#askPop button{border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:8px 12px;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#askPop button:hover{border-color:var(--brand);background:#f7faff}
#askPop button .d{width:8px;height:8px;border-radius:50%;display:inline-block}
#askPop .cancel{border:0;color:var(--muted);padding:6px 8px;font-size:15px}
/* 派生词 / 近义词 / 近形词 */
.bank{border-left:3px solid #d8d2c4;background:#faf9f5;border-radius:0 6px 6px 0;
  padding:8px 11px;margin-bottom:6px;font-size:12px;line-height:1.65}
.bank.deriv{border-left-color:#6fa77a;background:#f4faf5}
.bank.syn{border-left-color:#7db4ec;background:#f4f8fd}
.bank.conf{border-left-color:#f08b7e;background:#fdf5f3}
.bank.fam{border-left-color:#a98bd6;background:#f8f4fd}
.phead{background:#f8f4fd;border:1px solid #e6dbf6;border-radius:7px;padding:10px 12px;margin-bottom:10px}
.phead .ptype{display:inline-block;font-size:10px;color:#72549c;background:#fff;
  border-radius:20px;padding:2px 8px;margin-bottom:6px}
.phead .pmean{font-size:14px;color:#2e2d2a;font-weight:600;line-height:1.6}
.bank .bw{font-family:Georgia,serif;font-size:13px;font-weight:600;color:#1f3a5f}
.bank .bp{font-size:10px;color:#9a6b2f;font-style:italic;margin-left:6px}
.bank .bm{color:#403e38}
.bank .be{display:block;color:var(--muted);font-family:Georgia,serif;font-style:italic;margin-top:3px}
/* 形近词联想：字母圆标 A/B/C/D 竖排，像一组辨析题选项 */
.look-list{display:flex;flex-direction:column;gap:7px}
.look-row{display:flex;align-items:center;gap:10px;background:#fdf6ec;border:1px solid #f1e2c8;
  border-radius:8px;padding:7px 11px}
.look-row .lk{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#e8b96a;color:#fff;
  font:600 12px/24px Georgia,serif;text-align:center}
.look-row .lw{flex:0 0 auto;font:600 14px Georgia,serif;color:#7a4f16;min-width:96px}
.look-row .lh{color:#403e38;font-size:12px;line-height:1.5}
.look-row.hit{background:#eef4fd;border-color:#c5daf3}
.look-row.hit .lk{background:#2b4a7d}
.look-row.hit .lw{color:#1f3a5f}
.look-row.hit .lh:after{content:' ← 你划的';color:#2b4a7d;font-size:10px}
/* 课堂式近义词辨析 */
.syn-wrap{margin:2px 0 10px}
.syn-list{display:flex;flex-direction:column;gap:8px}
.syn-row{display:flex;gap:10px;background:#f4f8fd;border:1px solid #d9e6f5;
  border-radius:8px;padding:9px 11px}
.syn-row.hit{background:#eaf2fc;border-color:#a9c7ea}
.syn-row .sn{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:#7db4ec;color:#fff;
  font:600 11px/21px Georgia,serif;text-align:center}
.syn-row.hit .sn{background:#2b4a7d}
.syn-row .sb{flex:1;min-width:0}
.syn-row .sw{font:600 14px Georgia,serif;color:#1f3a5f;display:flex;align-items:center;gap:8px}
.syn-row .stag{font:10px/1.4 -apple-system,"Microsoft YaHei",sans-serif;color:#fff;background:#2b4a7d;
  border-radius:10px;padding:1px 8px}
.syn-row .sd{color:#403e38;font-size:12px;line-height:1.65;margin-top:3px}
.syn-row .se{color:var(--muted);font:italic 11px/1.5 Georgia,serif;margin-top:4px}
.exam-q{background:#fff8e8;border:1px solid #f0dcae;border-radius:8px;padding:10px 12px;margin-top:10px}
.exam-q .etag{display:inline-block;font-size:10px;color:#8a5a12;background:#f7e6bd;
  border-radius:20px;padding:2px 9px;margin-bottom:7px}
.exam-q .eq{font:14px/1.6 Georgia,serif;color:#2e2d2a}
.exam-q .blank{color:#c0392b;font-weight:700;letter-spacing:1px}
.exam-q .eans{font-size:12px;color:#7a4f16;margin-top:7px}
.exam-q .eans b{color:#c0392b;font-family:Georgia,serif;font-size:14px}
.exam-q .ewhy{font-size:12px;line-height:1.65;color:#5a5347;margin-top:6px;
  border-top:1px dashed #e6d3a8;padding-top:6px}
.sublabel{font-size:10px;color:var(--muted);letter-spacing:1px;margin:12px 0 6px}
/* 同类例举 */
.simtag{font-size:11px;color:var(--brand);background:var(--brand-soft);
  display:inline-block;border-radius:20px;padding:3px 10px;margin-bottom:8px}
.simrow{border:1px solid var(--line);border-radius:7px;padding:9px 11px;margin-bottom:7px;background:#fcfbf7}
.simrow.mine{background:#f2f7fc;border-color:#d9e6f4}
.simrow .en{font-family:Georgia,serif;font-size:13px;line-height:1.55;color:#2e3a48}
.simrow .zh{font-size:11.5px;color:#5a554a;margin-top:4px;line-height:1.6}
.simrow .pt{font-size:11px;color:var(--brand);margin-top:4px;line-height:1.6}
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.paper.mode-pen{cursor:crosshair;touch-action:pan-y pinch-zoom}
.paper.mode-erase{cursor:cell;touch-action:pan-y pinch-zoom}
/* 判定为画线后才禁止选字，避免拖到一半冒出蓝色选区 */
.paper.drawing #article{user-select:none;-webkit-user-select:none}
.hint{max-width:820px;margin:14px auto 0;font-size:12px;color:var(--muted);
  display:flex;align-items:center;gap:8px;line-height:1.6}
.hint b{color:var(--brand);font-weight:600}

/* ---------- 侧栏 ---------- */
.side-tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.side-tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;
  padding:14px 0;border-bottom:2px solid transparent}
.side-tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.side-status{padding:10px 16px;font-size:11px;color:var(--muted);background:#f4f2ec;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;flex:none}
.side-status .badge{margin-left:auto;background:#e3e8ef;color:var(--brand);
  border-radius:20px;padding:3px 9px;font-size:10px}
.side-body{flex:1;overflow-y:auto;padding:16px}
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:13px;line-height:1.9}
.empty .big{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:12px}
.steps{text-align:left;display:inline-block;margin-top:10px;font-size:12px;line-height:2.1;color:#6f6a5f}
.steps i{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;
  background:var(--brand-soft);color:var(--brand);border-radius:50%;font-style:normal;
  font-size:11px;margin-right:8px}

/* 注解卡 */
.card{background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:14px;
  box-shadow:0 1px 4px rgba(50,45,30,.04);overflow:hidden}
.card.focus{outline:2px solid var(--brand)}
.card-top{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid #f0ece3}
.card-top .tag{font-size:10px;padding:3px 8px;border-radius:20px;color:#5a5140}
.tag.vocab{background:var(--vocab-bg)} .tag.sentence{background:var(--sentence-bg)}
.tag.question{background:var(--question-bg)} .tag.phrase{background:var(--phrase-bg)}
.card-top .no{font-size:11px;color:var(--muted);margin-left:auto}
.card-top .swap{border:0;background:transparent;color:var(--muted);font-size:10px;
  padding:3px 5px;border-bottom:1px dashed #c9c3b5}
.card-top .swap:hover{color:var(--brand);border-bottom-color:var(--brand)}
.card-top .x{border:0;background:transparent;color:#b6b0a3;font-size:17px;line-height:1;padding:2px 4px}
.card-top .x:hover{color:#c0503f}
/* 备考建议页 */
.plan-hero{background:linear-gradient(135deg,#eef3fb,#fbfaf6);border:1px solid #dde6f2;border-radius:9px;padding:14px 15px;margin-bottom:16px}
.plan-hero .ph-tag{display:inline-block;font-size:10px;letter-spacing:.5px;background:var(--brand);color:#fff;border-radius:20px;padding:3px 9px;margin-bottom:9px}
.plan-hero h3{font-size:17px;margin:0 0 6px;color:var(--ink)}
.plan-hero p{font-size:12px;color:var(--muted);margin:0;line-height:1.7}
.plan-h{font-size:12px;font-weight:700;color:var(--brand);margin:18px 0 9px;padding-left:9px;border-left:3px solid var(--brand)}
.plan-focus{display:flex;flex-wrap:wrap;gap:6px}
.plan-focus span{font-size:11px;background:#eef3fa;color:#3c6698;padding:5px 10px;border-radius:20px}
.plan-list{margin:0;padding-left:19px;font-size:12px;line-height:1.75;color:#3f3c35}
.plan-list li{margin-bottom:7px;padding-left:2px}
.plan-note{margin-top:18px;font-size:11px;line-height:1.75;color:var(--muted);background:#f6f4ee;border-radius:7px;padding:10px 12px}
.card-top .replay{border:0;background:transparent;color:var(--muted);font-size:10px;
  padding:3px 5px;border-bottom:1px dashed #c9c3b5}
.card-top .replay:hover{color:var(--brand);border-bottom-color:var(--brand)}
.card-top .mode-tag{font-size:10px;color:var(--brand);background:#eef3fa;border-radius:20px;padding:2px 8px;white-space:nowrap}
/* 考试专属讲解模块 */
.exam-wrap{border:1px solid #dbe6f2;border-radius:9px;overflow:hidden;margin:12px 0}
.ew-title{background:#eef3fa;color:#3c6698;font-size:11px;font-weight:700;padding:7px 11px;letter-spacing:.3px}
.exam-sec{padding:10px 12px;border-top:1px solid #eef1f6}
.exam-sec:first-of-type{border-top:0}
.es-h{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:7px}
.exam-sec ul{margin:0;padding-left:18px;font-size:12px;line-height:1.7;color:#3f3c35}
.exam-sec p{margin:0;font-size:12px;line-height:1.7;color:#3f3c35}
.exam-sec .bank{padding:6px 9px}
.pair{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:12px;padding:4px 0;border-bottom:1px dashed #eee}
.pair:last-child{border-bottom:0}
.pair .pa{color:#b3403a}
.pair .ar{color:#a9a294}
.pair .pb{color:#2c6e49;font-weight:600}
.pair .pn{color:var(--muted);font-size:11px;flex-basis:100%}
/* 新用户使用指南 */
.tbtn.guide-btn{border-color:rgba(255,255,255,.55);font-weight:600}
.gd-steps{display:flex;gap:6px;padding:14px 22px 0}
.gd-steps i{flex:1;height:4px;border-radius:4px;background:#e7e3da;transition:background .2s}
.gd-steps i.on{background:var(--brand)}
.gd-body{padding:16px 24px 4px;flex:1;min-height:0;overflow-y:auto}
.gd-kicker{font-size:11px;color:var(--brand);font-weight:700;letter-spacing:1px;margin-bottom:8px}
.gd-body h4{font-size:19px;margin:0 0 12px;color:var(--ink)}
.gd-body p{font-size:13px;line-height:1.85;color:#4a4740;margin:0 0 12px}
.gd-card{background:#f7f9fc;border:1px solid #dde6f2;border-radius:9px;padding:11px 14px;margin-bottom:9px;font-size:12.5px;line-height:1.7;color:#45423b}
.gd-card b{color:var(--brand)}
.gd-card .gd-ico{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--brand);color:#fff;border-radius:6px;font-size:11px;margin-right:7px;font-weight:700}
.gd-num{display:inline-block;min-width:19px;height:19px;line-height:19px;text-align:center;background:#eef3fa;color:var(--brand);border-radius:50%;font-size:11px;font-weight:700;margin-right:7px}
.gd-tip{background:#fffaf0;border:1px solid #efe6cf;border-radius:8px;padding:10px 13px;font-size:11.5px;line-height:1.75;color:#7a6b45;margin:6px 0 12px}
.gd-foot{gap:10px}
.gd-foot .gd-count{margin-right:auto;font-size:11px;color:var(--muted)}
.quote{padding:12px 14px;background:#faf8f2;border-left:3px solid var(--brand);
  font-family:Georgia,serif;font-size:14px;line-height:1.65;color:#3b3a35}
.quote .ctx{display:block;margin-top:8px;font-family:-apple-system,sans-serif;font-size:11px;
  color:var(--muted);line-height:1.6;font-style:normal}
.card-content{padding:13px 14px;font-size:12.5px;line-height:1.75}
.sec{margin-bottom:13px}
.sec:last-child{margin-bottom:0}
.sec h4{margin:0 0 6px;font-size:11px;color:var(--brand);letter-spacing:1px;font-weight:700}
.sec p{margin:0 0 5px;color:#403e38}
.wordrow{padding:7px 0;border-bottom:1px dashed #eee9de;font-size:12px}
.wordrow:last-child{border:0}
.wordrow .term{font-family:Georgia,serif;font-size:14px;font-weight:600;color:#1f3a5f}
.wordrow .ph{color:var(--muted);font-size:11px;margin-left:7px}
.wordrow .pos{color:#9a6b2f;font-size:11px;margin-left:6px;font-style:italic}
.wordrow .mean{color:#403e38;display:block;margin-top:2px}
.wordrow .ex{color:var(--muted);display:block;margin-top:2px;font-family:Georgia,serif;font-style:italic}
.sec ul{margin:0;padding-left:17px;color:#403e38}
.sec li{margin-bottom:5px}
.tip{background:#f3f7fc;border-radius:6px;padding:9px 11px;color:#3b5570;font-size:12px;line-height:1.7}
.src{margin-top:12px;font-size:10px;color:#a49e90;text-align:right}
.ask{display:flex;gap:6px;padding:0 14px 13px}
.ask input{flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;outline:none}
.ask input:focus{border-color:var(--brand)}
.ask button{border:0;background:var(--brand);color:#fff;border-radius:6px;padding:0 12px;font-size:12px}
.followup{margin:0 14px 13px;background:#f7f5ef;border-radius:6px;padding:9px 11px;font-size:12px;line-height:1.7}
.followup b{color:var(--brand);font-size:11px}
.loading{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:6px 0}
.spin{width:12px;height:12px;border:2px solid #d8d3c7;border-top-color:var(--brand);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#b4483b;font-size:12px;line-height:1.7}

/* 标记列表 */
.stat{display:flex;gap:8px;margin-bottom:14px}
.stat div{flex:1;background:#fff;border:1px solid var(--line);border-radius:7px;
  padding:10px;text-align:center;font-size:11px;color:var(--muted)}
.stat div b{display:block;font-size:19px;color:var(--ink);margin-bottom:2px}
.markrow{display:flex;align-items:flex-start;gap:9px;background:#fff;border:1px solid var(--line);
  border-radius:7px;padding:10px 11px;margin-bottom:8px;cursor:pointer}
.markrow:hover{border-color:var(--brand)}
.markrow .dot{margin-top:5px}
.markrow .txt{flex:1;min-width:0}
.markrow .txt .t{font-family:Georgia,serif;font-size:13px;line-height:1.5;

<script>
'use strict';

/* ============================================================
   1. 内置文章
   ============================================================ */
const ARTICLES = [
{
  id:'boredom',
  title:'The Quiet Power of Boredom',
  sub:'六级精读 · 议论文 · 约 320 词',
  paras:[
    'In a world that rarely lets us sit still, boredom has acquired a bad reputation. We reach for our phones the moment a queue forms, and we fill every silent minute with a podcast, a message, or a scroll. Yet researchers who study creativity argue that this discomfort is not a flaw in our attention but a doorway: when the mind is left unoccupied, it begins to wander, and wandering is where unlikely connections are made.',
    'The mechanism is surprisingly ordinary. Without an external stimulus demanding response, the brain defaults to what neuroscientists call the default mode network, a set of regions that lights up when we daydream, recall the past, or imagine the future. In this state, fragments of memory are recombined rather than merely stored. A problem you abandoned yesterday may suddenly resurface, rearranged, while you are washing a cup or waiting for a bus.',
    'None of this means that deliberate effort is obsolete. What the evidence suggests, however, is a rhythm rather than a choice: intense concentration followed by a period of loose, unforced attention. Poets and mathematicians have long described the same pattern, though they rarely called it incubation. The insight arrives only after the work has been done, and only when the work has been set aside.',
    'The practical implication is modest but inconvenient. To cultivate boredom is to resist the reflex of reaching for a screen, and to tolerate the first few minutes of restlessness that follow. Those minutes feel unproductive precisely because nothing visible is happening. If we can stay with them, the mundane pause becomes less like wasted time and more like the quiet part of a conversation in which someone else, eventually, answers.',
    'Perhaps the most useful question is not how to eliminate boredom, but what we have been avoiding in the silence it opens. The answer, more often than not, is not a fact we forgot but a thought we had not yet allowed ourselves to think.'
  ]
},
{
  id:'places',
  title:'Why We Remember Places More Than Facts',
  sub:'六级精读 · 说明文 · 约 300 词',
  paras:[
    'Ask someone to recall a lecture they attended last month and they will probably offer a room: the angle of the light, the squeak of a chair, the seat they chose. The arguments themselves, carefully noted at the time, have often dissolved. This asymmetry is so familiar that we rarely question it, yet it reveals something important about how memory is organised.',
    'Psychologists distinguish between episodic memory, which binds an event to a particular time and place, and semantic memory, which holds facts stripped of their context. The distinction matters because the two systems appear to rely on different circuitry: the hippocampus, a seahorse-shaped structure deep in the brain, is heavily involved in constructing spatial scenes, whereas general knowledge is distributed more widely across the cortex.',
    'That is why the ancient technique known as the method of loci works so well. By placing each item to be remembered at a fixed point along a familiar route, a speaker can recover an entire speech simply by walking through it in imagination. The order of the rooms supplies the order of the ideas; the place does the remembering for you.',
    'There is a cost, however. Because a place carries so much, it can also distort. What we recall as a vivid scene may be a reconstruction assembled from habit and expectation rather than a faithful record. Eyewitness research has repeatedly shown that confidence and accuracy travel together far less often than we assume.',
    'For students, the lesson is less exotic than it sounds. Reviewing material in changing locations, tying an abstract claim to a concrete image, or simply noticing where you were when an idea finally clicked — each of these gives the fact somewhere to live. A fact without a place is a fact easily lost.'
  ]
},
{
  id:'light',
  title:'The City That Turned Off Its Lights',
  sub:'六级精读 · 科普 · 约 210 词',
  paras:[
    'When the town of Vardø replaced its streetlights with warmer, dimmer bulbs, residents expected little more than a modest saving on the electricity bill. What they had not anticipated was how differently the night would feel. Shadows returned to the corners of the square, and the sky, long washed out by orange glare, began to show stars.',
    'Light pollution is usually discussed as an astronomer\u2019s problem, but its effects reach far beyond telescopes. Artificial light at night interferes with the circadian rhythms that tell birds when to migrate, insects when to feed, and our own bodies when to sleep. Even a few lux of stray brightness can suppress melatonin, the hormone that prepares us for rest.',
    'The fix, engineers insist, is not darkness but direction. A well-designed lamp sends its beam downward, onto the pavement where it is needed, instead of scattering it sideways and upward into the atmosphere. Shielding costs little, yet it removes most of the wasted light.',
    'What makes such projects succeed is rarely the technology. It is the willingness to treat the night as something worth keeping, rather than an empty interval to be filled. In Vardø, the dimmer switch turned out to be a decision about what a town wants to be after sunset.'
  ]
}
];

{a:'boredom',match:'acquired a bad reputation',
 translation:'在一个几乎不让我们静下来的世界里，"无聊"落下了坏名声。',
 words:[

 ],
 structure:['In a world that rarely lets us sit still：介词短语作状语，that 引导定语从句修饰 world','boredom has acquired a bad reputation：主句，主谓宾'],

{a:'boredom',match:'researchers who study creativity argue that',

 ],

{a:'boredom',match:'recombined rather than merely stored',

 ],
 structure:['What the evidence suggests：what 引导主语从句','however：插入语，不影响句子结构','is a rhythm rather than a choice：系表结构','intense concentration followed by ...：过去分词短语作后置定语，解释 rhythm 的两段'],

{a:'boredom',match:'To cultivate boredom is to resist',

 grammar:['something / anything / nothing 等复合不定代词被形容词修饰时，形容词必须后置','precisely / partly / largely because ... 是六级阅读常见的原因强弱表达'],

{a:'boredom',match:'not how to eliminate boredom',

{a:'places',match:'Ask someone to recall a lecture',

{a:'places',match:'so familiar that we rarely question it',

 tip:'yet 在这里等于 but，但语气更轻，六级阅读里常用来引出真正重点。'},

{a:'places',match:'episodic memory, which binds',

  {term:'semantic',phonetic:'/sɪˈmæntɪk/',pos:'adj.',meaning:'语义的，与意义有关的',example:'Semantic knowledge is context-free.'},
  {term:'strip of',phonetic:'/strɪp/',pos:'phr.v.',meaning:'剥夺，剥离（某物）',example:'The summary strips the story of its detail.'}
 ],

{a:'places',match:'a seahorse-shaped structure',

  {term:'be involved in',phonetic:'—',pos:'phr.',meaning:'参与，卷入；涉及',example:'She is heavily involved in the project.'},

 ],

{a:'places',match:'By placing each item to be remembered',

  {term:'loci',phonetic:'/ˈləʊsaɪ/',pos:'n.',meaning:'locus 的复数，地点、位置；method of loci＝记忆宫殿法',example:'The method of loci dates back to ancient Greece.'},
  {term:'recover',phonetic:'/rɪˈkʌvə/',pos:'v.',meaning:'重新找回，恢复',example:'She recovered the deleted file.'}
 ],

{a:'places',match:'may be a reconstruction assembled',
 translation:'我们当作鲜活场景回忆起来的，可能是用习惯和预期拼装出来的重构，而非忠实的记录。',
 words:[
  {term:'vivid',phonetic:'/ˈvɪvɪd/',pos:'adj.',meaning:'生动的，鲜明的',example:'She gave a vivid account of the trip.'},

 ],

{a:'places',match:'far less often than we assume',

  {term:'assume',phonetic:'/əˈsjuːm/',pos:'v.',meaning:'假定，想当然地认为',example:'We assume that memory works like a recording.'}
 ],
 structure:['has repeatedly shown that ...：that 引导宾语从句','confidence and accuracy travel together：从句主语 + 谓语','far less often than we assume：比较结构'],

{a:'places',match:'Reviewing material in changing locations',
 translation:'在不同地点复习、把抽象论断绑到一个具体画面上、或者只是留意一下某个想法终于想通时自己身在何处——这些都在给事实找一个住处。',

  {term:'abstract',phonetic:'/ˈæbstrækt/',pos:'adj.',meaning:'抽象的',example:'An abstract claim needs a concrete example.'},
  {term:'click',phonetic:'/klɪk/',pos:'v.',meaning:'（口）突然明白，豁然开朗',example:'After three examples, the rule finally clicked.'}
 ],

{a:'light',match:'What they had not anticipated',

  {term:'anticipate',phonetic:'/ænˈtɪsɪpeɪt/',pos:'v.',meaning:'预料，预期',example:'We had not anticipated such a strong reaction.'},

 structure:['What they had not anticipated：what 引导主语从句','was how differently the night would feel：how 引导表语从句'],

{a:'light',match:'interferes with the circadian rhythms',
 translation:'夜间的人造光会干扰昼夜节律——正是这套节律告诉候鸟何时迁徙、昆虫何时进食、我们的身体何时该睡。',
 words:[
  {term:'interfere with',phonetic:'/ˌɪntəˈfɪə/',pos:'phr.v.',meaning:'干扰，妨碍',example:'Noise interferes with concentration.'},

  {term:'suppress',phonetic:'/səˈpres/',pos:'v.',meaning:'抑制，压制',example:'The drug suppresses appetite.'},

 ],

 tip:'定语从句里套三个并列宾语，先找 that，再找 tell，最后拆三个 when to do。'},

{a:'light',match:'The fix, engineers insist, is not darkness but direction',

  {term:'shield',phonetic:'/ʃiːld/',pos:'v./n.',meaning:'遮挡，加遮光罩；屏障',example:'Shield the lamp so light falls only downward.'},

{a:'light',match:'What makes such projects succeed',
 translation:'让这类项目成功的，往往不是技术本身，而是愿意把夜晚当成值得保留的东西，而不是一段待填满的空白。',

];

function loadState(){

    const r=JSON.parse(localStorage.getItem('huadu_v1')||'{}');
    if(r.cfg) S.cfg=Object.assign(S.cfg,r.cfg);
    if(r.fs) S.fs=r.fs;

  }catch(e){}
  try{
    const lib=JSON.parse(localStorage.getItem(LIB_KEY)||'[]');
    if(Array.isArray(lib)) S.library=lib.filter(a=>a&&a.id&&Array.isArray(a.paras)&&a.paras.length);
  }catch(e){}

    const c=JSON.parse(localStorage.getItem(CARD_KEY)||'{}');

}

}

}

/* ============================================================
   4. 文章渲染与分词
   ============================================================ */
function tokenize(str){
  const re=/(\s+|[A-Za-z]+(?:[’'\-][A-Za-z]+)*|\d+(?:[.,]\d+)?|[^\s])/g;
  const out=[]; let m,wi=0;
  while((m=re.exec(str))!==null){
    const raw=m[0];
    out.push({raw:raw,start:m.index,end:m.index+raw.length,
      wi:/^\s+$/.test(raw)?-1:wi++});
  }
  return out;
}
function renderArticle(){
  const a=S.article;
  articleEl.textContent='';
  const h=document.createElement('h1'); h.textContent=a.title; articleEl.appendChild(h);
  const sub=document.createElement('div'); sub.className='sub'; sub.textContent=a.sub; articleEl.appendChild(sub);
  S.toks=[];
  a.paras.forEach((para,pi)=>{
    const p=document.createElement('p'); if(pi===0)p.className='first';
    const toks=tokenize(para); S.toks.push(toks);
    toks.forEach(t=>{
      if(t.wi<0){ p.appendChild(document.createTextNode(t.raw)); }
      else{
        const sp=document.createElement('span');
        sp.className='w'; sp.textContent=t.raw;
        sp.dataset.p=pi; sp.dataset.w=t.wi;
        p.appendChild(sp);
      }
    });
    articleEl.appendChild(p);
  });
  $('#wordCount').textContent = a.paras.join(' ').split(/\s+/).length + ' 词';
  applyAllMarks();
  sizeCanvas();
}
function markText(m){
  const arr=S.toks[m.p]; if(!arr) return m.text||'';
  // 分词数组里含空白 token，必须按词索引 wi 建立映射后再截取原文
  const words=arr._words||(arr._words=arr.filter(t=>t.wi>=0));
  const a=words[m.s],b=words[m.e]; if(!a||!b) return m.text||'';
  return S.article.paras[m.p].slice(a.start,b.end);
}
function sentenceOf(m){
  const para=S.article.paras[m.p]||'';
  const frag=markText(m);
  const parts=para.split(/(?<=[.!?])\s+/);
  return parts.find(x=>x.includes(frag.slice(0,Math.min(frag.length,18)))) || para;
}
function applyAllMarks(){
  articleEl.querySelectorAll('.w.hl').forEach(sp=>{
    sp.classList.remove('hl','hl-vocab','hl-sentence','hl-question','hl-phrase');
    delete sp.dataset.mark;
  });
  S.marks.forEach(m=>{
    articleEl.querySelectorAll('.w[data-p="'+m.p+'"]').forEach(sp=>{
      const wi=+sp.dataset.w;
      if(wi>=m.s && wi<=m.e){
        sp.classList.add('hl','hl-'+m.type); sp.dataset.mark=m.id;
      }
    });
  });
}
function sizeCanvas(){
  const dpr=window.devicePixelRatio||1;
  const w=paper.clientWidth,h=paper.clientHeight;
  ink.width=Math.max(1,Math.round(w*dpr)); ink.height=Math.max(1,Math.round(h*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  redrawInk();
}
function redrawInk(){
  ctx.clearRect(0,0,paper.clientWidth,paper.clientHeight);
  const w=paper.clientWidth,h=paper.clientHeight;
  ctx.globalAlpha=.5;                      /* 笔迹半透明，浏览时不压住正文 */
  S.strokes.forEach(st=>{
    if(!st.pts||st.pts.length<1)return;
    ctx.strokeStyle=st.color||'#2b4a7d'; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.lineWidth=st.lw||2.4;
    ctx.beginPath();
    st.pts.forEach((pt,i)=>{ const x=pt[0]*w,y=pt[1]*h; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    if(st.pts.length===1){ const x=st.pts[0][0]*w,y=st.pts[0][1]*h; ctx.lineTo(x+.1,y+.1); }
    ctx.stroke();
  });
  ctx.globalAlpha=1;
}

/* ============================================================
   5. 标记
   ============================================================ */
let seq=1;
let PEND=null;

/* 划完先就地询问类型；若用户选了固定分类则直接标记 */
function addMark(p,s,e,type,source){
  if(s>e) return;
  const t=type||S.pen;
  if(t==='ask'){ queueAsk({p:p,s:s,e:e,src:source||'text'}); return; }
  const overlap=S.marks.find(m=>m.p===p && m.s===s && m.e===e);
  if(overlap){ focusMark(overlap.id); return; }
  const m={id:'m'+(seq++),p:p,s:s,e:e,type:t,src:source||'text'};
  m.text=markText(m); m.ctx=sentenceOf(m);
  S.marks.push(m); S.scrollBottom=true;
  applyAllMarks(); renderSide();
  analyze(m);
  return m;
}
function queueAsk(g){
  (PEND||(PEND=[])).push(g);
  markPending();
  const sp=articleEl.querySelector('.w[data-p="'+g.p+'"][data-w="'+g.e+'"]');
  if(sp) showAskPop(sp.getBoundingClientRect());
}
function markPending(){
  articleEl.querySelectorAll('.w.pending').forEach(sp=>sp.classList.remove('pending'));
  (PEND||[]).forEach(g=>{
    articleEl.querySelectorAll('.w[data-p="'+g.p+'"]').forEach(sp=>{
      const wi=+sp.dataset.w; if(wi>=g.s&&wi<=g.e) sp.classList.add('pending');
    });
  });
}
function clearPending(){
  articleEl.querySelectorAll('.w.pending').forEach(sp=>sp.classList.remove('pending'));
  PEND=null; $('#askPop').classList.add('hidden');
}
function showAskPop(rect){
  const pop=$('#askPop');
  pop.innerHTML='<span class="lead">这一处是</span>'+
    '<button data-type="sentence"><i class="d" style="background:var(--sentence)"></i>长难句</button>'+
    '<button data-type="vocab"><i class="d" style="background:var(--vocab)"></i>词汇</button>'+
    '<button data-type="phrase"><i class="d" style="background:var(--phrase)"></i>词组</button>'+
    '<button class="cancel" data-type="cancel" title="先不标记">×</button>';
  pop.classList.remove('hidden');
  const w=pop.offsetWidth,h=pop.offsetHeight;
  let x=rect.left,y=rect.bottom+8;
  if(y+h>window.innerHeight-10) y=rect.top-h-8;
  if(y<10) y=10;
  x=Math.max(10,Math.min(x,window.innerWidth-w-10));
  pop.style.left=x+'px'; pop.style.top=y+'px';
}
$('#askPop').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  const t=b.dataset.type,list=PEND||[];
  clearPending();
  if(t==='cancel')return;
  list.forEach(g=>addMark(g.p,g.s,g.e,t,g.src));
};
document.addEventListener('pointerdown',e=>{
  if(!$('#askPop').classList.contains('hidden') && !e.target.closest('#askPop')) clearPending();
},true);
function delMark(id){
  S.marks=S.marks.filter(m=>m.id!==id);
  delete S.results[id]; delete S.followups[id];
  applyAllMarks(); renderSide();
}
function focusMark(id){
  switchTab('ai');
  const card=document.querySelector('.card[data-id="'+id+'"]');
  if(card){ card.scrollIntoView({behavior:'smooth',block:'center'}); card.classList.add('focus');
    setTimeout(()=>card.classList.remove('focus'),1200); }
  const sp=articleEl.querySelector('.w[data-mark="'+id+'"]');
  if(sp){ sp.scrollIntoView({behavior:'smooth',block:'center'});
    sp.classList.add('flash'); setTimeout(()=>sp.classList.remove('flash'),1000); }
}

/* ============================================================
   6. 文本划选 → 自动识别
   ============================================================ */
function spansFromSelection(){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.toString().trim()) return [];
  const range=sel.getRangeAt(0);
  const hit=[];
  articleEl.querySelectorAll('.w').forEach(sp=>{
    try{ if(range.intersectsNode(sp)) hit.push(sp); }catch(e){}
  });
  sel.removeAllRanges();
  const groups={};
  hit.forEach(sp=>{
    const p=+sp.dataset.p; (groups[p]||(groups[p]=[])).push(+sp.dataset.w);
  });
  return Object.keys(groups).map(p=>({p:+p,s:Math.min.apply(null,groups[p]),e:Math.max.apply(null,groups[p])}));
}

/* ============================================================
   7. 手写笔 / 橡皮：笔迹包围盒覆盖到的词 → 自动识别
   ============================================================ */
let cur=null;
function relPoint(e){
  const r=paper.getBoundingClientRect();
  return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];
}
function eraseAt(p){
  let best=-1,bd=1e9;
  S.strokes.forEach((st,i)=>{
    st.pts.forEach(pt=>{
      const d=Math.hypot((pt[0]-p[0]),(pt[1]-p[1])*0.6);
      if(d<bd){bd=d;best=i;}
    });
  });
  if(best>=0 && bd<0.035){ S.strokes.splice(best,1); redrawInk(); }
}
/* 画布不再常驻拦截：轻点照常选字、点高亮看讲解；只有真正拖动才落笔 */
let gesture=null;
const DRAW_TH=7;
paper.addEventListener('pointerdown',e=>{
  if(S.mode!=='pen'&&S.mode!=='erase')return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.altKey)return;                       /* 按住 Alt 拖 = 纯选字，不画线 */
  gesture={x:e.clientX,y:e.clientY,id:e.pointerId,mode:S.mode,started:false};
},true);
paper.addEventListener('pointermove',e=>{
  if(!gesture||gesture.id!==e.pointerId)return;
  if(!gesture.started){
    if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)<DRAW_TH)return;
    gesture.started=true;
    try{ window.getSelection().removeAllRanges(); }catch(err){}
    paper.classList.add('drawing');
    try{ paper.setPointerCapture(e.pointerId); }catch(err){}
    if(gesture.mode==='pen'){
      cur={pts:[relPoint(e)],color:'#2b4a7d',lw:e.pointerType==='pen'?2.8:2.3};
      S.strokes.push(cur); redrawInk();
    }
  }
  if(gesture.mode==='pen'&&cur){
    const p=relPoint(e),last=cur.pts[cur.pts.length-1];
    if(Math.hypot(p[0]-last[0],(p[1]-last[1])*0.5)>=0.002){ cur.pts.push(p); redrawInk(); }
  }
},true);
paper.addEventListener('selectstart',e=>{ if(gesture&&gesture.started)e.preventDefault(); },true);
function finishGesture(commit,e){
  if(!gesture)return;
  const g=gesture; gesture=null;
  paper.classList.remove('drawing');
  try{ paper.releasePointerCapture(g.id); }catch(err){}
  if(!g.started){
    if(g.mode==='erase'&&commit&&e)eraseAt(relPoint(e));
    return;                                  /* 轻点：浏览器自己处理选中 / 点击高亮 */
  }
  if(g.mode==='pen')endStroke(commit);
}
paper.addEventListener('pointerup',e=>finishGesture(true,e),true);
paper.addEventListener('pointercancel',e=>finishGesture(false,e),true);
function endStroke(commit){
  if(!cur)return;
  const st=cur; cur=null;
  /* 触屏纵向滑动被系统接管滚动时会收到 pointercancel：丢弃半截笔迹，别误识别 */
  if(!commit || st.pts.length<2){ S.strokes.pop(); redrawInk(); return; }
  recognize(st);
}

function recognize(st){
  const W=paper.clientWidth,H=paper.clientHeight;
  let x1=1,y1=1,x2=0,y2=0;
  st.pts.forEach(p=>{ x1=Math.min(x1,p[0]);x2=Math.max(x2,p[0]);y1=Math.min(y1,p[1]);y2=Math.max(y2,p[1]); });
  // 划线手势通常是一条细线，向上下各扩一段，覆盖整行文字
  const box={x1:x1*W-4,y1:y1*H-13,x2:x2*W+4,y2:y2*H+13};
  const pr=paper.getBoundingClientRect();
  const groups={};
  articleEl.querySelectorAll('.w').forEach(sp=>{
    const r=sp.getBoundingClientRect();
    const l=r.left-pr.left,t=r.top-pr.top,rr=r.right-pr.left,b=r.bottom-pr.top;
    const iw=Math.max(0,Math.min(box.x2,rr)-Math.max(box.x1,l));
    const ih=Math.max(0,Math.min(box.y2,b)-Math.max(box.y1,t));
    const area=r.width*r.height;
    if(area>0 && (iw*ih)/area>0.3){
      const p=+sp.dataset.p; (groups[p]||(groups[p]=[])).push(+sp.dataset.w);
    }
  });
  const found=Object.keys(groups).map(p=>({p:+p,s:Math.min.apply(null,groups[p]),e:Math.max.apply(null,groups[p])}));
  if(!found.length){ toast('这一笔没有圈到文字，已保留为自由批注'); return; }
  found.forEach(g=>addMark(g.p,g.s,g.e,S.pen,'pen'));
  toast('已识别 '+found.length+' 处划线');
}

].map(g=>g.map(x=>{
  const i=x.indexOf(' '); return {word:x.slice(0,i),hint:x.slice(i+1)};
}));
/* 按划到的词找它所在的那一组；命中则返回整组（3-5 个），否则按首字母/词根凑一组 */
function localLookalikes(m){
  const terms=[...new Set(((m.text||'').match(/[A-Za-z]{4,}/g)||[]).map(x=>wordKey(x.toLowerCase())))];
  for(const t of terms){
    const g=LOOKALIKE_GROUPS.find(grp=>grp.some(x=>wordKey(x.word.toLowerCase())===t||wordKey(x.word.toLowerCase()).indexOf(t)===0));
    if(g) return g.slice(0,5).map(x=>({word:x.word,hint:x.hint}));
  }
  /* 未命中固定组：从词库 conf 与本词拼一组，保证至少 3 个 */
  let head=terms[0];
  if(head){
    const bank=WORD_BANK[head];
    const out=[];
    if(bank) bank.conf.forEach(x=>{ if(out.length<4) out.push({word:x[0],hint:x[1]}); });
    if(out.length>=2) return out.slice(0,5);
  }
  return [];  /* 凑不够就不硬编，交给 AI 生成 */
}

/* 划到的词命中某组就返回整组（逐词辨析 + 真题语境），否则返回 null */
function localSynFor(m){
  const terms=[...new Set(((m.text||'').match(/[A-Za-z]{3,}/g)||[]).map(x=>wordKey(x.toLowerCase())))];
  for(const t of terms){
    const g=SYN_GROUPS.find(grp=>grp.trigger.some(k=>wordKey(k)===t||wordKey(k).indexOf(t)===0||t.indexOf(wordKey(k))===0));
    if(g) return g;
  }
  return null;
}

/* 构词法线索：离线只给可验证的构词提示，不编造词义 */
const AFFIX=[

/* 文章里划到的常是变形（acquired / deliberately / dissolved），先还原到词族原形再查库 */
const WORD_ALIAS={

 stimuli:'stimulus',stimulated:'stimulus',stimulating:'stimulus',

 modesty:'modest',modestly:'modest',

 scattering:'scatter',scattered:'scatter',
 distinction:'distinguish',distinguished:'distinguish',distinguishable:'distinguish',

function wordKey(t){
  if(WORD_BANK[t])return t;
  if(WORD_ALIAS[t])return WORD_ALIAS[t];
  const c=[];
  if(/ies$/.test(t))c.push(t.replace(/ies$/,'y'));
  if(/ly$/.test(t))c.push(t.replace(/ly$/,''));
  if(/ed$/.test(t))c.push(t.replace(/ed$/,''),t.replace(/ed$/,'e'));
  if(/d$/.test(t))c.push(t.replace(/d$/,''));
  if(/ing$/.test(t))c.push(t.replace(/ing$/,''),t.replace(/ing$/,'e'));
  if(/s$/.test(t)&&!/ss$/.test(t))c.push(t.replace(/s$/,''));
  if(/(ation|ition|tion|sion)$/.test(t))c.push(t.replace(/(ation|ition|tion|sion)$/,''),t.replace(/(ation|ition|tion|sion)$/,'te'));
  if(/(ment|ness|ity|acy|ence|ance)$/.test(t))c.push(t.replace(/(ment|ness|ity|acy|ence|ance)$/,''));
  for(const x of c){ if(WORD_BANK[x])return x; if(WORD_ALIAS[x])return WORD_ALIAS[x]; }
  return t;
}
function detectTags(t){
  const s=' '+(t||'').toLowerCase()+' ', raw=t||'';
  const tags=[];
  if(/\b(which|that|who|whom|whose|where)\b/.test(s))tags.push('定语从句');
  if(/\b(what|whether|why|how)\b/.test(s))tags.push('名词性从句');
  if(/\bnot\b[\s\S]{0,80}\bbut\b/.test(s))tags.push('not...but 并列对比');
  if(/rather than|instead of/.test(s))tags.push('rather than 对比');
  if(/,\s*[a-z]+(ed|en)\b|\b\w+ed\s+by\b/i.test(raw))tags.push('分词作后置定语');
  if(/,\s+(a|an|the)\s+[^,]{4,60},/.test(raw))tags.push('同位语');
  if(/\b(although|though|while|whereas|however|yet)\b/.test(s))tags.push('让步与对比');
  if(/\b(because|since|therefore)\b/.test(s))tags.push('原因与结果');
  if(/\bby\s+\w+ing\b/.test(s))tags.push('by doing 方式状语');
  if(/\bso\s+\w+\s+that\b/.test(s))tags.push('so...that 结果状语');
  if(/\b(is|are|was|were|been|be)\s+\w+(ed|en)\b/.test(s))tags.push('被动语态');
  if(/\bthan\b/.test(s))tags.push('比较结构');
  if(/\b(how|what|when|where|which)\s+to\s+\w+/.test(s))tags.push('疑问词 + 不定式');
  if(/\b(have|has|had)\s+(been\s+)?\w+(ed|en)\b/.test(s))tags.push('完成时态');
  if(/\b(make|makes|call|calls)\s+\w+\s+\w+/.test(s))tags.push('使役与复合宾语');
  if(!tags.length)tags.push('基本句型');
  return [...new Set(tags)].slice(0,3);
}
function buildSimilar(m,tags){
  const sentences=S.article.paras.join(' ').split(/(?<=[.!?])\s+/)
    .map(x=>x.trim()).filter(x=>x.length>25);
  const cur=(m.ctx||'').trim(), inArticle=[];
  sentences.forEach(s=>{
    if(s===cur||inArticle.length>=2)return;
    const shared=detectTags(s).filter(t=>tags.includes(t));
    if(shared.length) inArticle.push({en:s,note:'共同结构：'+shared.join(' / ')});
  });
  const examples=[];
  tags.forEach(t=>{ (SIMILAR_BANK[t]||[]).forEach(x=>{
    if(examples.length<3) examples.push({en:x[0],zh:x[1],point:x[2]});
  }); });
  if(!examples.length) SIMILAR_BANK['基本句型'].forEach(x=>examples.push({en:x[0],zh:x[1],point:x[2]}));
  return {tags:tags,inArticle:inArticle,examples:examples};
}

function localExamExtras(m){
  const secs=EXAM_SECTIONS[S.exam]||[], out={};
  if(!secs.length) return out;
  const word=((m.text||'').trim().split(/\s+/)[0]||'').replace(/[^A-Za-z'-]/g,'');
  const key=wordKey(word), bank=WORD_BANK[key];
  secs.forEach(s=>{
    let v=null;
    if(s.ty==='pairs'){
      if(bank&&bank.syn&&bank.syn.length) v=bank.syn.slice(0,3).map(x=>({a:word,b:x[0],note:x[1]}));
      else v=[{a:word,b:'在原文与题干间找近义改写',note:'离线未收录该词替换，接入 AI 后给出题干词与原文词的对应'}];
    }else if(s.ty==='bank'){
      if(bank){
        if(s.k==='render'||s.k==='field'||s.k==='usable') v=bank.syn.slice(0,3).map(x=>({word:x[0],diff:x[1],example:x[2]}));
        else v=[{word:word,diff:bank.stem,example:''}];
      }else v=[{word:word,diff:'离线未收录释义，接入 AI 后按本考试要求生成',example:''}];
    }else if(s.ty==='list'){
      const arr=[];
      if(bank) arr.push(bank.stem);
      AFFIX.forEach(a=>{ if(a[0].test(word)) arr.push(a[1]); });
      if(!arr.length) arr.push('离线未预置该点，接入 AI 后按本考试要求生成');
      v=arr.slice(0,3);
    }else if(s.ty==='text'){
      v=bank?bank.stem:'离线只有可验证的词形与原文线索，接入 AI 后生成「'+s.t+'」。';
    }
    /* qa 离线不占位、不编造真题，留空由 AI 生成 */
    if(v!==null) out[s.k]=v;
  });
  return out;
}
function localAnalyze(m){
  const r=m.type==='sentence'?localSentence(m):(m.type==='phrase'?localPhrase(m):localVocab(m));
  r.examExtras=localExamExtras(m); r.examMode=S.exam; return r;
}

/* 长难句：结构分析 + 本文同类句 + 举一反三 */
function localSentence(m){
  let hits=lookupLocal(m.ctx||''), scope='所在句子';
  if(!hits.length){ hits=lookupLocal(m.text); scope='划线片段'; }
  const structure=[],grammar=[];
  hits.forEach(h=>{ (h.structure||[]).forEach(x=>structure.push(x));
    (h.grammar||[]).forEach(x=>grammar.push(x)); });
  const tags=detectTags(m.ctx||m.text);
  if(!structure.length){
    structure.push('这句共 '+((m.ctx||'').match(/[A-Za-z]+/g)||[]).length+' 个词；先圈出主句谓语动词，再逐层挂回从句与修饰成分。');
    tags.forEach(t=>structure.push('识别到「'+t+'」：'+(SIMILAR_BANK[t]?SIMILAR_BANK[t][0][2]:'先找该结构的标志词。')));
  }
  if(!grammar.length) grammar.push('离线模式未预置这句的语法点；接入 AI 后可获得逐条语法讲解。');
  return {
    translation:hits.length?hits[0].translation:'',
    words:[], structure:structure, grammar:grammar,
    similar:buildSimilar(m,tags),
    tip:hits.length?hits.map(h=>h.tip).filter(Boolean).join(' ')
      :'练长难句最快的方式是认结构：先拆这一句，再拿下面的同类句各拆一遍。',
    source:hits.length?('内置精读注解'+(scope==='所在句子'?' · 已按划线扩展到整句':'')):'本地结构预分析'
  };
}
/* 词汇：释义 + 派生词 + 近义词辨析 + 近形词辨析 */
function localVocab(m){
  const STOP=new Set(['the','and','but','of','to','in','on','at','are','was','were','been','its','this','that','these','those','with','for','from','has','have','had','they','our','their','his','her','can','may','will','would','more','than','only','what','when','where','which','who','into','out','all','any','each','such','even','not','yet','still','one','two','how','why','its','per']);
  const terms=[...new Set(((m.text||'').match(/[A-Za-z]{4,}/g)||[]).map(x=>x.toLowerCase()))]
    .filter(x=>!STOP.has(x)).slice(0,3);
  const annotWords=[]; ANNOT.forEach(h=>(h.words||[]).forEach(w=>annotWords.push(w)));
  const words=[],derivatives=[],synonyms=[],confusables=[],notes=[];
  terms.forEach(t=>{
    const key=wordKey(t), bank=WORD_BANK[key];
    const aw=annotWords.find(w=>w.term.toLowerCase()===key);
    if(aw) words.push(aw);
    else if(bank) words.push({term:key,meaning:'见下方词族与辨析（离线模式不猜测释义）'});
    else words.push({term:t,meaning:'未收录释义，接入 AI 后可获得音标、词性与例句'});
    if(bank){
      if(key!==t) notes.push('你划到的是 '+t+'，以下按词族原形 '+key+' 讲解。');
      notes.push(bank.stem);
      bank.deriv.forEach(x=>derivatives.push({word:x[0],pos:x[1],meaning:x[2]}));
      bank.syn.forEach(x=>synonyms.push({word:x[0],diff:x[1],example:x[2]}));
      bank.conf.forEach(x=>confusables.push({word:x[0],diff:x[1],example:x[2]}));
    }else{
      AFFIX.forEach(a=>{ if(a[0].test(t)) notes.push(t+'：'+a[1]); });
      const stem=t.replace(/(tion|sion|ment|ness|ity|acy|able|ible|ive|ous|ful|less|ly|ise|ize|ify|ate|ed|ing|un|re|in|im|dis|pre|inter|over)$/,'').slice(0,5);
      if(stem.length>=3){
        const all=[...new Set((S.article.paras.join(' ').match(/[A-Za-z]{4,}/g)||[]).map(x=>x.toLowerCase()))];
        const kin=all.filter(x=>x.startsWith(stem)&&x!==t).slice(0,4);
        if(kin.length) notes.push('本文同词干或同前缀的词：'+kin.join(' / '));
      }
    }
  });
  const hits=lookupLocal(m.ctx||'');
  /* 从原句里摘出划线词前后的真实搭配，不编造词组 */
  const ctx0=m.ctx||'', src=((m.text||'').trim().split(/\s+/)[0]||'').replace(/[^A-Za-z']/g,'');
  if(src.length>=3){
    const re=new RegExp('(?:[A-Za-z]+\\s+){0,2}'+src+'(?:\\s+[A-Za-z]+){0,2}','i');
    const mm=ctx0.match(re);
    if(mm && mm[0].trim().toLowerCase()!==src.toLowerCase())
      notes.push('文中搭配：'+mm[0].trim()+'（摘自原句，可直接核对）');
  }
  const sg=localSynFor(m);
  return {
    translation:hits.length?hits[0].translation:'',
    words:words, derivatives:derivatives,
    synonyms:sg?sg.words:synonyms, synSet:sg?{words:sg.words,exam:sg.exam}:null,
    confusables:confusables,
    lookalikes:localLookalikes(m),
    notes:[...new Set(notes)],
    tip:derivatives.length
      ?'近形词最容易丢分：把上面每组词各造一个句子，比单背中文释义有效。'
      :'这个词未收录现成辨析；接入 AI 后可自动生成派生词、近义词与近形词三组对比。',
    source:derivatives.length?'内置词汇知识库':'本地构词预分析'
  };
}

/* ---------- 词组：词形还原 + 模糊命中 ---------- */
function normPhraseWords(s){
  return s.split(' ').filter(Boolean).map(w=>{
    if(/ies$/.test(w)) return w.replace(/ies$/,'y');
    if(/ied$/.test(w)) return w.replace(/ied$/,'y');
    if(/ing$/.test(w)){ const a=w.replace(/ing$/,''); return a.length>=3?a:w; }
    if(/ed$/.test(w)){ const a=w.replace(/ed$/,''); return a.length>=3?a:w; }
    if(/s$/.test(w)&&!/(ss|us|is)$/.test(w)) return w.replace(/s$/,'');
    return w;
  }).join(' ');
}
function lookupPhrase(text){
  const raw=String(text||'').toLowerCase().replace(/[^a-z'\- ]+/g,' ').replace(/\s+/g,' ').trim();
  if(raw.length<3) return null;
  const keys=Object.keys(PHRASE_BANK);
  if(/\bnot\b[\s\S]{0,90}\bbut\b/.test(raw))
    return {key:'not but',data:PHRASE_BANK['not but'],matched:'not...but...'};
  if(PHRASE_BANK[raw]) return {key:raw,data:PHRASE_BANK[raw],matched:raw};
  const norm=normPhraseWords(raw);
  if(PHRASE_BANK[norm]) return {key:norm,data:PHRASE_BANK[norm],matched:raw};
  let sub=null,subLen=0;
  keys.forEach(k=>{
    const kk=k.trim();
    if(kk.length>=5 && raw.includes(kk) && kk.length>subLen){
      sub={key:k,data:PHRASE_BANK[k],matched:kk}; subLen=kk.length;
    }
  });
  if(sub) return sub;
  const toks=new Set(norm.split(' ').filter(x=>x.length>2));
  let best=null,n=1;
  keys.forEach(k=>{
    const kt=k.split(' ').filter(x=>x.length>2);
    const h=kt.filter(x=>toks.has(x)||toks.has(normPhraseWords(x))).length;
    if(h>=2&&h>n){ n=h; best={key:k,data:PHRASE_BANK[k],matched:raw}; }
  });
  return best;
}
/* 未收录词组：只给可验证的结构线索，不编造释义 */
function phraseShape(text){
  const s=String(text||'').toLowerCase().replace(/\s+/g,' ').trim();
  const parts=s.split(' '), last=parts[parts.length-1]||'', out=[];
  const PREP=/^(of|in|on|to|with|for|from|at|by|into|about|over|under|between|among|across|against|upon|beyond|as)$/;
  if(PREP.test(last)) out.push('以介词 '+last+' 结尾，是「实词 + 介词」搭配；'+last+' 后面接搭配对象，前面的词决定方向。');
  if(/^(up|out|off|away|down|back|aside|over)$/.test(last))
    out.push('末尾 '+last+' 是副词小品词，构成短语动词；它常带方向或「完成／离开」的含义，注意与介词区分。');
  if(/\bto\s+[a-z]+$/.test(s)) out.push('含 to + 动词原形，可能是不定式结构；确认前面的动词是否要求接不定式。');
  if(/\bas\s+\w+\s+as\b/.test(s)) out.push('同级比较 as...as，中间用形容词或副词原级。');
  if(/\bthe\s+\w+\s+of\b/.test(s)) out.push('the + 名词 + of 的名词短语，中心词在 the 之后。');
  if(/(ing|ed)$/.test(last)) out.push('末尾是分词，可能是分词短语作定语或状语，先找它的逻辑主语。');
  out.push('共 '+parts.length+' 个词；离线模式不猜测释义，接入 AI 后可得到释义、同族词组与易混辨析。');
  return out;
}
function localPhrase(m){
  let hit=lookupPhrase(m.text||''), scope='划线片段';
  if(!hit && m.ctx){ hit=lookupPhrase(m.ctx); scope='所在句子'; }
  const hits=lookupLocal(m.ctx||'');
  const all=S.article.paras.join(' ');
  const sentences=all.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(Boolean);
  if(hit){
    const d=hit.data, notes=[], needle=(hit.matched||'').toLowerCase();
    sentences.forEach(s=>{
      if(s!==m.ctx && notes.length<2 && needle && needle.indexOf('...')<0 && s.toLowerCase().includes(needle))
        notes.push('本文另一处：'+s);
    });
    return {
      translation:hits.length?hits[0].translation:'',
      meaning:d.m, ptype:d.t,
      collocations:[d.u].concat(d.c||[]),
      family:(d.f||[]).map(x=>({phrase:x[0],diff:x[1],example:x[2]})),
      confusables:(d.x||[]).map(x=>({phrase:x[0],diff:x[1],example:x[2]})),
      examples:[],
      notes:notes.concat(scope==='所在句子'?['你划的是一段文字，以下按其中的词组 '+hit.key+' 讲解。']:[]),
      tip:d.tip, phraseKey:hit.key,
      source:'内置词组知识库'+(
        scope==='所在句子'?' · 已从划线扩展到句中的 '+hit.key
        :(hit.matched!==hit.key?' · 已按词形还原到 '+hit.key:''))
    };
  }
  const notes=phraseShape(m.text);
  const words=((m.text||'').toLowerCase().match(/[a-z]{3,}/g)||[]), head=words[0];
  if(head) sentences.filter(s=>s!==m.ctx&&s.toLowerCase().includes(head)).slice(0,2)
    .forEach(s=>notes.push('本文同样含 '+head+' 的句子：'+s));
  return {
    translation:hits.length?hits[0].translation:'',
    meaning:'', ptype:'', collocations:[], family:[], confusables:[], examples:[],
    notes:notes,
    tip:'这个词组未收录现成辨析；离线只给可验证的结构线索。接入 AI 后可获得释义、同族词组与易混辨析。',
    source:'本地词组预分析'
  };
}

async function callAPI(messages){
  const base=S.cfg.base.replace(/\/+$/,'');
  const url=base.endsWith('/chat/completions')?base:base+'/chat/completions';
  const res=await fetch(url,{method:'POST',headers:{
    'Content-Type':'application/json','Authorization':'Bearer '+S.cfg.key.trim()
  },body:JSON.stringify({model:S.cfg.model||'gpt-4o-mini',messages:messages,temperature:0.3})});
  if(!res.ok){ const t=await res.text(); throw new Error('接口返回 '+res.status+'：'+t.slice(0,180)); }
  const j=await res.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
}
function parseJSONish(s){
  let t=String(s).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a>=0&&b>a) t=t.slice(a,b+1);
  return JSON.parse(t);
}
function normResult(o,source){
  const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
  return {
    translation:o.translation||'',
    words:arr(o.words),
    structure:arr(o.structure),
    grammar:arr(o.grammar),
    derivatives:arr(o.derivatives),
    synonyms:arr(o.synonyms),
    synSet:(function(){ if(o.synSet&&Array.isArray(o.synSet.words)) return o.synSet;
      if(o.synExam&&o.synExam.q) return {words:arr(o.synonyms),exam:o.synExam}; return null; })(),
    confusables:arr(o.confusables),
    lookalikes:(function(){const seen={},out=[];arr(o.lookalikes).forEach(x=>{
      const y=typeof x==='string'?{word:x,hint:''}:x, k=(y.word||'').toLowerCase().replace(/[^a-z]/g,'');
      if(k&&!seen[k]){seen[k]=1;out.push(y);} }); return out.slice(0,5);})(),
    similar:Array.isArray(o.similar)?o.similar:[],
    meaning:o.meaning||'', ptype:o.ptype||'',
    collocations:arr(o.collocations), family:arr(o.family), examples:arr(o.examples),
    notes:[],
    examExtras:(o.examExtras&&typeof o.examExtras==='object'&&!Array.isArray(o.examExtras))?o.examExtras:{},
    examMode:S.exam,
    tip:o.tip||o.answer||'', source:source
  };
}
async function analyze(m){
  S.busy[m.id]=true; renderSide();
  try{
    if(cfgIsOn()){
      const isSent=m.type==='sentence', isPhrase=m.type==='phrase';
      const task=isSent
        ? '请分析这个长难句的主干与从句，并给出同结构类型的例句做举一反三。'
        : isPhrase
          ? '请讲清这个词组的释义、常接成分与典型句型，并给同族词组、易混词组辨析和例句。'
          : '学生想弄清这个词的用法。请给派生词、近义词辨析、近形词辨析，每组都要具体到语义、语体与搭配差别。';
      const label=isSent?'长难句':(isPhrase?'词组':'词汇');
      const sys=isSent?SYS_SENTENCE:(isPhrase?SYS_PHRASE:SYS_VOCAB);
      const prompt='文章标题：'+S.article.title+'\n所在句子：'+m.ctx+'\n\n学生划出的片段：\n'+m.text+
        '\n\n分类：'+label+'\n任务：'+task;
      const add=EXAMS[S.exam].prompt;
      const secs=EXAM_SECTIONS[S.exam]||[];
      const secReq=secs.length?('\n\n【本模式专属讲解模块】你还必须在 JSON 里输出一个 "examExtras" 对象，包含键：'+secs.map(s=>'"'+s.k+'"').join('、')+'。各键要求：'+secs.map(s=>s.k+'（'+s.t+'）'+s.p).join('；')+'。值与划线内容无关时给空字符串或空数组，不要编造。'):'';
      const sysFull=sys+(add?('\n\n【备考模式要求】'+add):'')+secReq;
      const raw=await callAPI([{role:'system',content:sysFull},{role:'user',content:prompt}]);
      let o; try{ o=parseJSONish(raw); }catch(e){ o={tip:raw}; }
      const r=normResult(o,'AI 精读');
      if(isSent){
        r.similar=(r.similar||[]).map(x=>typeof x==='string'?{en:x,zh:'',point:''}:x);
        if(!r.similar.length) r.similar=buildSimilar(m,detectTags(m.ctx||m.text)).examples;
      }
      if(isPhrase){
        r.family=(r.family||[]).map(x=>typeof x==='string'?{phrase:x,diff:'',example:''}:x);
        r.confusables=(r.confusables||[]).map(x=>typeof x==='string'?{phrase:x,diff:'',example:''}:x);
        const pf=localPhrase(m);
        if(!r.collocations.length) r.collocations=pf.collocations;
        if(!r.family.length) r.family=pf.family;
        if(!r.confusables.length) r.confusables=pf.confusables;
      }
      if(!isSent && !isPhrase){
        const vf=localVocab(m);
        if(!r.words.length) r.words=vf.words;
        if(!r.derivatives.length) r.derivatives=vf.derivatives;
        /* 划到的词命中内置真题高频组时，用逐词精细辨析替换 AI 的浅层近义词 */
        const sg=localSynFor(m);
        if(sg){ r.synSet={words:sg.words,exam:sg.exam}; r.synonyms=sg.words; }
        else if(!r.synonyms.length) r.synonyms=vf.synonyms;
        if(!r.confusables.length) r.confusables=vf.confusables;
        if(!r.translation) r.translation=vf.translation;
        if(!r.lookalikes||r.lookalikes.length<3){ const ll=localLookalikes(m); if(ll.length>=3) r.lookalikes=ll; }
      }
      S.results[m.id]=r;
    }else{
      S.results[m.id]=localAnalyze(m);
    }
  }catch(e){
    S.results[m.id]={error:'AI 接口调用失败：'+esc(e.message)+'<br>已自动切换为本地结果，可在「AI 设置」检查接口信息。',
      fallback:localAnalyze(m),source:'调用失败'};
  }
  delete S.busy[m.id];
  try{ syncCard(m); }catch(e){}
  renderSide();
}
async function followup(m,q){
  (S.followups[m.id]||(S.followups[m.id]=[])).push({q:q,a:null});
  renderSide();
  const item=S.followups[m.id][S.followups[m.id].length-1];
  try{
    if(cfgIsOn()){
      const prompt='文章：'+S.article.title+'\n上下文：'+m.ctx+'\n划线片段：'+m.text+
        '\n\n学生的追问：'+q+'\n\n请用中文具体回答这个追问，并把答案写进 JSON 的 tip 字段；其余字段可留空数组或空字符串。';
      const add=EXAMS[S.exam].prompt;
      const raw=await callAPI([{role:'system',content:add?(SYS+'\n\n【备考模式要求】'+add):SYS},{role:'user',content:prompt}]);
      let o; try{o=parseJSONish(raw);}catch(e){o={tip:raw};}
      item.a=o.tip||o.answer||raw;
    }else{
      const r=S.results[m.id];
      const base=(r&&r.tip)?'结合这段的注解：'+r.tip:'';
      item.a='已记下你的问题。当前未接入 AI，无法生成针对性解答；'+
        (base?base+' ':'')+'在「AI 设置」填入接口信息后，追问会由 AI 结合原文回答。';
    }
  }catch(e){ item.a='追问失败：'+e.message; }
  renderSide();
}

        (v.why?'<div class="ewhy">'+esc(v.why)+'</div>':'')+'</div>';
    }else if(Array.isArray(v)){
      inner='<ul>'+v.map(e=>'<li>'+esc(typeof e==='string'?e:(e.note||e.word||e.b||''))+'</li>').join('')+'</ul>';
    }else{
      inner='<p>'+esc(v)+'</p>';
    }
    h+='<div class="exam-sec"><div class="es-h">'+esc(s.t)+'</div>'+inner+'</div>';
  });
  if(!h) return '';
  return '<div class="exam-wrap"><div class="ew-title">'+esc((EXAMS[mode]||{name:''}).name)+' · 专属讲解模块</div>'+h+'</div>';
}
function resultHTML(r,type,m){
  if(!r) return '';
  let h='';
  if(r.translation) h+=sec(type==='sentence'?'整句翻译':'所在句译文','<p>'+esc(r.translation)+'</p>');
  if(type==='sentence'){
    if(r.structure&&r.structure.length) h+=sec('句子结构','<ul>'+r.structure.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');
    if(r.grammar&&r.grammar.length) h+=sec('语法与搭配','<ul>'+r.grammar.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');
    h+=similarHTML(r.similar);
  }else if(type==='phrase'){
    if(r.meaning||r.ptype) h+='<div class="phead">'+
      (r.ptype?'<span class="ptype">'+esc(r.ptype)+'</span>':'')+
      (r.meaning?'<div class="pmean">'+esc(r.meaning)+'</div>':'')+'</div>';
    if(r.collocations&&r.collocations.length)
      h+=sec('用法与常见搭配','<ul>'+r.collocations.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');
    h+=bankHTML('同族词组',r.family,'fam');
    h+=bankHTML('易混词组辨析',r.confusables,'conf');
    if(r.examples&&r.examples.length)
      h+=sec('例句',r.examples.map(x=>'<div class="simrow"><div class="en">'+esc(x.en||'')+'</div>'+
        (x.zh?'<div class="zh">'+esc(x.zh)+'</div>':'')+'</div>').join(''));
    if(r.notes&&r.notes.length) h+=sec('结构线索','<ul>'+r.notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');
  }else{
    if(r.words&&r.words.length){
      h+=sec('词义',r.words.map(w=>
        '<div class="wordrow"><span class="term">'+esc(w.term||'')+'</span>'+
        (w.phonetic?'<span class="ph">'+esc(w.phonetic)+'</span>':'')+
        (w.pos?'<span class="pos">'+esc(w.pos)+'</span>':'')+
        '<span class="mean">'+esc(w.meaning||'')+'</span>'+
        (w.example?'<span class="ex">'+esc(w.example)+'</span>':'')+'</div>').join(''));
    }
    if(r.notes&&r.notes.length) h+=sec('构词与搭配线索','<ul>'+r.notes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>');
    h+=bankHTML('派生词 · 同族词',r.derivatives,'deriv');
    if(r.synSet) h+=synSetHTML(r.synSet,m);
    else if(r.synonyms&&r.synonyms.length) h+=synSetHTML({words:r.synonyms,exam:null},m);
    else h+=bankHTML('近义词辨析',r.synonyms,'syn');
    h+=bankHTML('近形词辨析 · 易混',r.confusables,'conf');
    h+=lookalikesHTML(r.lookalikes,m);
  }
  h+=examSectionsHTML(r.examExtras,(r.examMode||S.exam),type);
  if(r.tip) h+='<div class="tip">'+esc(r.tip)+'</div>';
  h+='<div class="src">来源：'+esc(r.source||'')+'</div>';
  return h;
}
function bankHTML(title,list,cls){
  if(!list||!list.length)return '';
  let h='<div class="sec"><h4>'+title+'</h4>';
  list.forEach(x=>{
    const w=x.word||x.w||x.term||x.phrase||'', pos=x.pos||'',
      mean=x.meaning||x.diff||'', ex=x.example||x.ex||'';
    h+='<div class="bank '+cls+'"><span class="bw">'+esc(w)+'</span>'+
      (pos?'<span class="bp">'+esc(pos)+'</span>':'')+
      '<span class="bm">'+esc(mean)+'</span>'+
      (ex?'<span class="be">'+esc(ex)+'</span>':'')+'</div>';
  });
  return h+'</div>';
}
function lookalikesHTML(list,m){
  if(!list||list.length<2) return '';
  const letters='ABCDE';
  const hit=(m&&m.text||'').toLowerCase();
  const rows=list.slice(0,5).map((x,i)=>{
    const w=x.word||x.w||'', hint=x.hint||x.meaning||x.diff||'';
    const isHit=w && hit.indexOf(w.toLowerCase())>-1;
    return '<div class="look-row'+(isHit?' hit':'')+'"><span class="lk">'+letters[i]+'</span>'+
      '<span class="lw">'+esc(w)+'</span><span class="lh">'+esc(hint)+'</span></div>';
  }).join('');
  return '<div class="sec"><h4>形近词联想 · 一起记</h4><div class="look-list">'+rows+'</div></div>';
}
/* 课堂式近义词辨析：逐词说清因什么/侧重什么/语体/搭配 + 真题语境 */
function synSetHTML(ss,m){
  if(!ss||!ss.words||!ss.words.length) return '';
  const hit=(m&&m.text||'').toLowerCase();
  const rows=ss.words.map((x,i)=>{
    const w=x.word||'', isHit=w&&hit.indexOf(w.toLowerCase())>-1;
    return '<div class="syn-row'+(isHit?' hit':'')+'"><span class="sn">'+(i+1)+'</span>'+
      '<div class="sb"><div class="sw">'+esc(w)+(isHit?'<span class="stag">你划的</span>':'')+'</div>'+
      '<div class="sd">'+esc(x.diff||'')+'</div>'+
      (x.example?'<div class="se">'+esc(x.example)+'</div>':'')+'</div></div>';
  }).join('');
  let h='<div class="syn-wrap"><h4>近义词辨析 · 课堂式</h4><div class="syn-list">'+rows+'</div>';
  const ex=ss.exam;
  if(ex&&ex.q){
    h+='<div class="exam-q"><span class="etag">'+esc(ex.tag||'真题考点')+'</span>'+
      '<div class="eq">'+esc(ex.q).replace(/{___}|___/g,'<span class="blank">____</span>')+'</div>'+
      '<div class="eans">答案：<b>'+esc(ex.answer||'')+'</b></div>'+
      (ex.why?'<div class="ewhy">'+esc(ex.why)+'</div>':'')+'</div>';
  }
  return h+'</div>';
}
function similarHTML(sim){
  if(!sim) return '';
  const isArr=Array.isArray(sim);
  const tags=isArr?[]:(sim.tags||[]), mine=isArr?[]:(sim.inArticle||[]),
    ex=isArr?sim:(sim.examples||[]);
  let h='<div class="sec"><h4>同类例举</h4>';
  if(tags.length) h+='<div class="simtag">识别到的结构：'+esc(tags.join(' / '))+'</div>';
  if(mine.length){
    h+='<div class="sublabel">本文中的同类句</div>';
    mine.forEach(x=>h+='<div class="simrow mine"><div class="en">'+esc(x.en)+'</div>'+
      (x.note?'<div class="pt">'+esc(x.note)+'</div>':'')+'</div>');
  }
  if(ex.length){
    h+='<div class="sublabel">举一反三</div>';
    ex.forEach(x=>h+='<div class="simrow"><div class="en">'+esc(x.en||'')+'</div>'+
      (x.zh?'<div class="zh">'+esc(x.zh)+'</div>':'')+
      (x.point?'<div class="pt">'+esc(x.point)+'</div>':'')+'</div>');
  }
  return h+'</div>';
}
function sec(title,inner){ return '<div class="sec"><h4>'+title+'</h4>'+inner+'</div>'; }
function renderMarks(body){
  const c={vocab:0,sentence:0,phrase:0}; S.marks.forEach(m=>{c[m.type]=(c[m.type]||0)+1;});
  let h='<div class="stat"><div><b>'+c.vocab+'</b>词汇</div><div><b>'+c.sentence+'</b>长难句</div><div><b>'+c.phrase+'</b>词组</div></div>';
  if(!S.marks.length) h+='<div class="empty">还没有标记。<br>回到文章划一段试试。</div>';
  else h+=S.marks.map(m=>'<div class="markrow" data-id="'+m.id+'"><i class="dot '+m.type+'"></i>'+
    '<div class="txt"><div class="t">'+esc(m.text)+'</div><div class="m">'+TYPES[m.type]+' · 第 '+(m.p+1)+' 段 · '+(m.src==='pen'?'手写圈画':'划选')+'</div></div>'+
    '<button class="x" data-del="'+m.id+'">×</button></div>').join('')+
    '<div class="list-act"><button id="exportMd">导出笔记</button><button id="goDeck">去复习</button><button id="clearAll">清空全部</button></div>';
  body.innerHTML=h;
  body.querySelectorAll('.markrow').forEach(row=>row.onclick=e=>{

  });
  const ex=$('#exportMd'); if(ex)ex.onclick=exportNotes;
  const gd=$('#goDeck'); if(gd)gd.onclick=()=>switchTab('cards');

    S.marks=[];S.results={};S.followups={};S.strokes=[];
    if(S.article) delete S.saved[S.article.id];
    applyAllMarks();redrawInk();renderSide();toast('已清空标记、笔迹与对应记忆卡');
  };
}

/* ============================================================
   9b. 记忆卡：自动建卡 + 间隔重复 + Anki 导出
   ============================================================ */
const INTERVALS=[0,1,2,4,7,15,30,60];   // Leitner 盒子对应的间隔（天）
const MAX_CARDS=300;
function resultText(m){
  const raw=S.results[m.id];
  return raw&&!raw.error?raw:(raw&&raw.fallback);
}
/* 把划线处挖成空格，做成主动回忆的正面 */
function clozeHTML(m){
  const ctx=m.ctx||'', t=(m.text||'').trim();
  if(!t) return esc(ctx);
  const probe=t.slice(0,Math.min(t.length,18)).toLowerCase();
  const i=ctx.toLowerCase().indexOf(probe);
  if(i<0) return esc(ctx);
  return esc(ctx.slice(0,i))+'<em>____</em>'+esc(ctx.slice(i+t.length));
}
function cardFront(m){
  if(m.type==='sentence')
    return '<div class="cf-q">'+esc(m.ctx||m.text)+'</div>'+
      '<div class="cf-hint">试着拆出主句主干、从句与修饰成分，再想整句意思。</div>';
  return '<div class="cf-q">'+clozeHTML(m)+'</div>'+
    '<div class="cf-hint">'+(m.type==='phrase'
      ?'划线处是哪个词组？想想它的搭配和易混词组。'
      :'划线处是哪个词？想想释义、派生词和易混词。')+'</div>';
}
function cardBack(m,r){
  let h='<div class="cb-a">'+esc(m.text||'')+'</div>';
  if(!r) return h+'<div class="cb-sec">这条还没生成讲解，回到文章重新划一次即可。</div>';
  if(r.translation) h+='<div class="cb-sec"><b>译文</b> '+esc(r.translation)+'</div>';
  if(m.type==='sentence'){
    (r.structure||[]).slice(0,3).forEach(x=>h+='<div class="cb-row">'+esc(x)+'</div>');
    const sim=r.similar, ex=Array.isArray(sim)?sim:((sim&&sim.examples)||[]);
    if(ex&&ex.length) h+='<div class="cb-row">同类句：'+esc(ex[0].en||'')+'</div>';
  }else if(m.type==='phrase'){
    if(r.meaning) h+='<div class="cb-sec"><b>'+esc(r.ptype||'释义')+'</b> '+esc(r.meaning)+'</div>';
    (r.collocations||[]).slice(0,2).forEach(x=>h+='<div class="cb-row">'+esc(x)+'</div>');
    (r.confusables||[]).slice(0,2).forEach(x=>h+='<div class="cb-row">易混 '+
      esc(x.phrase||x.word||'')+'：'+esc(x.diff||'')+'</div>');
  }else{
    (r.words||[]).slice(0,1).forEach(w=>h+='<div class="cb-sec"><b>释义</b> '+esc(w.meaning||'')+'</div>');
    (r.derivatives||[]).slice(0,2).forEach(x=>h+='<div class="cb-row">'+esc(x.word||'')+' '+esc(x.meaning||'')+'</div>');
    (r.confusables||[]).slice(0,2).forEach(x=>h+='<div class="cb-row">易混 '+
      esc(x.word||x.phrase||'')+'：'+esc(x.diff||'')+'</div>');
    if(r.lookalikes&&r.lookalikes.length)
      h+='<div class="cb-row">形近词：'+(r.lookalikes||[]).slice(0,5).map(x=>
        esc(x.word||'')+(x.hint?'（'+esc(x.hint)+'）':'')).join('、')+'</div>';
    if(r.synSet&&r.synSet.exam&&r.synSet.exam.q)
      h+='<div class="cb-row">真题：'+esc(r.synSet.exam.q)+' → <b>'+esc(r.synSet.exam.answer||'')+'</b></div>';
  }
  if(r.tip) h+='<div class="cb-row">'+esc(r.tip)+'</div>';
  return h;
}
/* 划过就自动进卡；讲解更新时刷新背面，但保留复习进度 */
function syncCard(m){
  const r=resultText(m), old=S.cards[m.id];
  const c={
    id:m.id, type:m.type, text:m.text||'', ctx:m.ctx||'',
    articleId:S.article?S.article.id:'', articleTitle:S.article?S.article.title:'',
    front:cardFront(m), back:cardBack(m,r), updated:Date.now(),
    box:old?old.box:0, due:old?old.due:Date.now(),
    reps:old?old.reps:0, lapses:old?old.lapses:0,
    last:old?old.last:0, created:old?old.created:Date.now()
  };
  S.cards[m.id]=c;
  const ids=Object.keys(S.cards);
  if(ids.length>MAX_CARDS){
    ids.sort((a,b)=>(S.cards[a].created||0)-(S.cards[b].created||0));
    delete S.cards[ids[0]];
  }
  saveCards();
}
function dueCards(){
  const now=Date.now();
  return Object.values(S.cards)
    .filter(c=>!c.suspended && (S.cardFilter==='all'||c.type===S.cardFilter) && (c.due||0)<=now)
    .sort((a,b)=>(a.due||0)-(b.due||0));
}
function startDeck(){
  S.deck=dueCards().map(c=>c.id);
  S.cardPos=0; S.flipped=false;
}
function practiceAll(){
  S.deck=Object.values(S.cards)
    .filter(c=>!c.suspended&&(S.cardFilter==='all'||c.type===S.cardFilter))
    .sort((a,b)=>(a.box||0)-(b.box||0)).map(c=>c.id);
  S.cardPos=0; S.flipped=false; renderSide();
}
function currentCard(){ return S.cards[S.deck[S.cardPos]]||null; }
function flipCard(){ if(currentCard()){ S.flipped=!S.flipped; renderSide(); } }
function gradeCard(g){
  const c=currentCard(); if(!c||!S.flipped) return;
  const now=Date.now(), day=86400000;
  c.reps=(c.reps||0)+1; c.last=now;
  if(g===1){ c.box=0; c.lapses=(c.lapses||0)+1; c.due=now+10*60*1000; }
  else if(g===2){ c.due=now+day; }
  else { c.box=Math.min(INTERVALS.length-1,(c.box||0)+1); c.due=now+(INTERVALS[c.box]||60)*day; }
  const today=new Date(now).toLocaleDateString('sv-SE');
  const yesterday=new Date(now-day).toLocaleDateString('sv-SE');
  if(S.cardStats.lastDay!==today){
    S.cardStats.streak=(S.cardStats.lastDay===yesterday)?(S.cardStats.streak||0)+1:1;
    S.cardStats.lastDay=today;
  }
  S.cardStats.studied=(S.cardStats.studied||0)+1;
  saveCards();
  S.flipped=false; S.cardPos++;
  if(S.cardPos>=S.deck.length) startDeck();
  renderSide();
}
function removeCurrentCard(){
  const c=currentCard(); if(!c){ toast('当前没有卡片'); return; }
  delete S.cards[c.id]; saveCards();
  S.deck=S.deck.filter(x=>x!==c.id);
  if(S.cardPos>=S.deck.length) startDeck();
  renderSide(); toast('已移出记忆卡（文章里的标记保留）');
}
function resetDeck(){
  Object.values(S.cards).forEach(c=>{ c.box=0;c.due=Date.now();c.reps=0;c.lapses=0;c.last=0; });
  S.cardStats={studied:0,streak:0,lastDay:''};
  saveCards(); startDeck(); renderSide(); toast('复习进度已重置，全部回到待复习');
}
function exportAnki(){
  const cards=Object.values(S.cards);
  if(!cards.length){ toast('还没有记忆卡，先划一处试试'); return; }
  const clean=s=>String(s||'').replace(/[\t\r\n]+/g,' ').replace(/\s{2,}/g,' ');
  const txt='#separator:Tab\n#html:true\n#deck:划读 · English Reader\n'+
    cards.map(c=>clean(c.front)+'\t'+clean(c.back)).join('\n');
  openModal('<h3>导出 Anki 卡片</h3><div class="body">'+
    '共 '+cards.length+' 张卡片，Tab 分隔并允许 HTML。导入 Anki 时选「Basic」笔记类型，字段对应 Front / Back，'+
    '牌组会自动归到「划读 · English Reader」。<div class="export-pre" style="margin-top:12px">'+
    esc(txt.slice(0,1000))+(txt.length>1000?' …':'')+'</div>'+
    '<div class="foot"><button onclick="closeModal()">关闭</button>'+
    '<button id="copyAnki">复制文本</button><button class="primary" id="dlAnki">下载 .txt</button></div></div>');
  $('#copyAnki').onclick=async()=>{
    try{ await navigator.clipboard.writeText(txt); toast('已复制，可直接粘进 Anki 导入框'); }
    catch(e){ const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
      ta.select();document.execCommand('copy');ta.remove();toast('已复制'); }
  };
  $('#dlAnki').onclick=()=>{
    const b=new Blob([txt],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='划读-记忆卡-Anki.txt';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('已下载');
  };
}
function renderCards(body){
  const all=Object.values(S.cards), total=all.length, due=dueCards().length;
  const mastered=all.filter(c=>(c.box||0)>=3).length;
  let h='<div class="deck-top"><div class="deck-stats">'+
    '<div><b>'+total+'</b><span>总卡数</span></div>'+
    '<div><b>'+due+'</b><span>待复习</span></div>'+
    '<div><b>'+mastered+'</b><span>已掌握</span></div>'+
    '<div><b>'+(S.cardStats.streak||0)+'</b><span>连续天数</span></div>'+
    '</div><div class="deck-bar"><i style="width:'+(total?Math.round(mastered/total*100):0)+'%"></i></div></div>';
  h+='<div class="deck-filter">'+[['all','全部'],['vocab','词汇'],['phrase','词组'],['sentence','长难句']]
    .map(x=>'<button data-f="'+x[0]+'" class="'+(S.cardFilter===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div>';
  const c=currentCard();
  if(!c){
    h+='<div class="deck-done"><div class="big">'+(total?'这一轮复习完了':'还没有记忆卡')+'</div>'+
      (total?'当前筛选下没有到期的卡片。<br>明天再来，或者现在再练一轮巩固。'
            :'在文章上划一处、选好类型，卡片会自动出现在这里。<br>词汇和词组会做成填空，长难句练拆主干。')+
      (total?'<div style="margin-top:14px"><button class="tbtn" id="againDeck">再练一轮</button></div>':'')+
      '</div>';
  }else{
    h+='<div class="flash'+(S.flipped?' flip':'')+'" id="flash">'+
      '<div class="fhead"><span class="tag '+c.type+'">'+(TYPES[c.type]||'卡片')+'</span>'+
      '<span>'+esc(c.articleTitle||'')+'</span>'+
      '<span style="margin-left:auto">'+(S.cardPos+1)+' / '+S.deck.length+'</span></div>'+
      '<div class="fbody">'+(S.flipped?c.back:c.front)+'</div>'+
      '<div class="cf-foot">'+(S.flipped?'想起来了吗？给自己打个分':'点击卡片或按空格翻面 · 先看原句回忆')+'</div></div>';
    h+='<div class="deck-actions">'+
      '<button class="g1" data-g="1" '+(S.flipped?'':'disabled')+'>忘了<small>10 分钟后再来</small></button>'+
      '<button class="g2" data-g="2" '+(S.flipped?'':'disabled')+'>模糊<small>明天再见</small></button>'+
      '<button class="g3" data-g="3" '+(S.flipped?'':'disabled')+'>记得<small>拉长间隔</small></button></div>';
    h+='<div class="deck-tip">快捷键 <span class="deck-key">空格</span> 翻卡　'+
      '<span class="deck-key">1</span> <span class="deck-key">2</span> <span class="deck-key">3</span> 评分</div>';
  }
  h+='<div class="deck-foot"><button id="ankiOut">导出 Anki</button>'+
    '<button id="delCard">移除当前卡</button><button id="resetDeck">重置进度</button></div>';
  body.innerHTML=h;
  body.querySelectorAll('.deck-filter button').forEach(b=>b.onclick=()=>{
    S.cardFilter=b.dataset.f; startDeck(); renderSide(); });
  const fl=$('#flash'); if(fl) fl.onclick=flipCard;
