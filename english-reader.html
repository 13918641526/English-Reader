/* ============================================================
   11. 文件导入与解析
   全程在本机浏览器完成，文件不会上传到任何服务器。
   txt / md / html / docx / epub / pdf
   ============================================================ */
const MAX_CHARS=120000, MAX_LIB=24;
const PDFJS_URL='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js';
const WNS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const DCNS='http://purl.org/dc/elements/1.1/';

function decodeText(buf){
  let s=new TextDecoder('utf-8').decode(buf);
  const bad=(s.match(/\ufffd/g)||[]).length;
  if(bad>3){ try{ const g=new TextDecoder('gbk').decode(buf);
    if((g.match(/\ufffd/g)||[]).length<bad) s=g; }catch(e){} }
  return s;
}
function cleanText(s){
  return String(s||'').replace(/\r\n?/g,'\n').replace(/\u00a0/g,' ')
    .replace(/[\u200b-\u200d\ufeff]/g,'').replace(/[ \t]+/g,' ');
}
/* 合并 PDF / 网页复制带来的硬换行：下一行以小写开头才接回上一行 */
function mergeWrappedLines(lines){
  const out=[]; let gap=false;
  for(const raw of lines){
    const l=String(raw==null?'':raw).trim();
    if(!l){ gap=true; continue; }
    const prev=out[out.length-1];
    if(!gap && prev && !/[.!?:;"')\]]$/.test(prev) && /^[a-z(,;]/.test(l)){
      out[out.length-1]=prev.replace(/-\s*$/,'')+l;
    }else out.push(l);
    gap=false;
  }
  return out;
}
function splitParas(text,dewrap){
  const t=cleanText(text);
  if(!t.trim()) return [];
  let parts=t.split(/\n\s*\n+/);
  if(parts.length===1 && t.split('\n').length>2) parts=t.split('\n');
  let lines=parts.map(x=>x.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean);
  if(dewrap) lines=mergeWrappedLines(lines);
  return lines.map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
}
function capParas(paras){
  let n=0; const out=[];
  for(const p of paras){ if(n+p.length>MAX_CHARS) return {paras:out,truncated:true};
    out.push(p); n+=p.length; }
  return {paras:out,truncated:false};
}

/* ---------- 最小 ZIP 读取器（docx / epub 本质都是 zip） ---------- */
async function unzip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf), td=new TextDecoder('utf-8');
  let eocd=-1;
  const min=Math.max(0,u8.length-65558);
  for(let i=u8.length-22;i>=min;i--){ if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;} }
  if(eocd<0) throw new Error('不是有效的 zip 结构，文件可能损坏');
  const count=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true), map={};
  for(let k=0;k<count;k++){
    if(off+46>u8.length || dv.getUint32(off,true)!==0x02014b50) break;
    const flag=dv.getUint16(off+8,true), method=dv.getUint16(off+10,true);
    const csize=dv.getUint32(off+20,true);
    const fnl=dv.getUint16(off+28,true), exl=dv.getUint16(off+30,true), cml=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    if(flag&0x1) throw new Error('文件已被加密，请先解除保护');
    const name=td.decode(u8.subarray(off+46,off+46+fnl)).replace(/\\/g,'/');
    const lfnl=dv.getUint16(lho+26,true), lex=dv.getUint16(lho+28,true);
    map[name]={start:lho+30+lfnl+lex,csize,method};
    off+=46+fnl+exl+cml;
  }
  return {
    names:Object.keys(map),
    async text(name){
      const f=map[name]; if(!f) return null;
      const raw=u8.subarray(f.start,f.start+f.csize);
      let bytes;
      if(f.method===0) bytes=raw;
      else if(f.method===8){
        if(typeof DecompressionStream==='undefined')
          throw new Error('当前浏览器不支持解压缩，请升级到 Chrome 103+ / Edge / Safari 16.4+，或先另存为 txt');
        const ds=new DecompressionStream('deflate-raw');
        const st=new Blob([raw]).stream().pipeThrough(ds);
        bytes=new Uint8Array(await new Response(st).arrayBuffer());
      }else throw new Error('不支持的压缩格式（method '+f.method+'）');
      return new TextDecoder('utf-8').decode(bytes);
    }
  };
}

/* ---------- HTML / XHTML → 段落 ---------- */
function htmlToParas(html){
  const d=new DOMParser().parseFromString(html,'text/html');
  d.querySelectorAll('script,style,nav,header,footer,svg,math,noscript,form,button,iframe,select,textarea').forEach(n=>n.remove());
  const root=d.body||d.documentElement;
  root.querySelectorAll('br').forEach(n=>n.replaceWith(d.createTextNode('\n')));
  root.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,td,th,figcaption,dd,dt,div,section,article,tr,hr')
    .forEach(n=>n.appendChild(d.createTextNode('\n')));
  return (root.textContent||'').split(/\n+/)
    .map(s=>s.replace(/[ \t\u00a0]+/g,' ').trim()).filter(Boolean);
}

/* ---------- docx ---------- */
async function parseDocx(buf){
  const z=await unzip(buf);
  const xml=await z.text('word/document.xml');
  if(!xml) throw new Error('找不到 word/document.xml，可能不是标准 docx（旧版 .doc 请先另存为 .docx）');
  const d=new DOMParser().parseFromString(xml,'application/xml');
  if(d.getElementsByTagName('parsererror').length) throw new Error('docx 正文解析失败');
  const ps=d.getElementsByTagNameNS(WNS,'p'), out=[];
  for(let i=0;i<ps.length;i++){
    let s='';
    (function walk(node){
      for(const c of Array.from(node.childNodes||[])){
        if(c.nodeType!==1) continue;
        const ln=c.localName;
        if(ln==='t') s+=c.textContent;
        else if(ln==='tab'||ln==='br'||ln==='cr') s+=' ';
        else if(ln==='noBreakHyphen') s+='-';
        else if(ln!=='instrText'&&ln!=='delText'&&ln!=='rPr'&&ln!=='pPr') walk(c);
      }
    })(ps[i]);
    const t=s.replace(/\s+/g,' ').trim();
    if(t) out.push(t);
  }
  let title='';
  const core=await z.text('docProps/core.xml');
  if(core){ const c=new DOMParser().parseFromString(core,'application/xml');
    const el=c.getElementsByTagNameNS(DCNS,'title')[0]; if(el) title=el.textContent.trim(); }
  return {paras:out,title:title};
}

/* ---------- epub ---------- */
function pathJoin(base,rel){
  const out=[];
  base.split('/').slice(0,-1).concat(String(rel).split('/')).forEach(p=>{
    if(!p||p==='.') return;
    if(p==='..') out.pop(); else out.push(p);
  });
  return out.join('/');
}
async function parseEpub(buf){
  const z=await unzip(buf);
  let opfPath='';
  const container=await z.text('META-INF/container.xml');
  if(container){
    const d=new DOMParser().parseFromString(container,'application/xml');
    const rf=d.getElementsByTagNameNS('*','rootfile')[0];
    if(rf) opfPath=rf.getAttribute('full-path')||'';
  }
  let paths=[],title='';
  if(opfPath){
    const opf=await z.text(opfPath);
    if(opf){
      const d=new DOMParser().parseFromString(opf,'application/xml'), idmap={};
      Array.from(d.getElementsByTagNameNS('*','item')).forEach(it=>{ idmap[it.getAttribute('id')]=it.getAttribute('href'); });
      Array.from(d.getElementsByTagNameNS('*','itemref')).forEach(ir=>{
        const href=idmap[ir.getAttribute('idref')];
        if(href){ let h=href.split('#')[0]; try{ h=decodeURIComponent(h); }catch(e){}
          paths.push(pathJoin(opfPath,h)); }
      });
      const t=d.getElementsByTagNameNS(DCNS,'title')[0]; if(t) title=t.textContent.trim();
    }
  }
  if(!paths.length) paths=z.names.filter(n=>/\.(x?html?|htm)$/i.test(n)&&!/^META-INF\//i.test(n)).sort();
  if(!paths.length) throw new Error('epub 里找不到正文页面');
  const paras=[];
  for(const p of paths.slice(0,80)){
    const html=await z.text(p); if(!html) continue;
    htmlToParas(html).forEach(x=>{
      if(x.length<2) return;
      if(/^(contents|table of contents|copyright|cover|index)$/i.test(x)) return;
      paras.push(x);
    });
    if(paras.join('').length>MAX_CHARS) break;
  }
  return {paras:paras,title:title};
}

/* ---------- PDF：优先在线 pdf.js，离线时退回本地文字流提取 ---------- */
let pdfLibPromise=null;
function loadPdfLib(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfLibPromise) return pdfLibPromise;
  pdfLibPromise=new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=PDFJS_URL;
    const timer=setTimeout(()=>rej(new Error('联网加载 PDF 组件超时')),15000);
    s.onload=()=>{ clearTimeout(timer); const lib=window.pdfjsLib;
      if(!lib) return rej(new Error('PDF 组件加载异常'));
      lib.GlobalWorkerOptions.workerSrc=PDFJS_URL.replace('pdf.min.js','pdf.worker.min.js');
      res(lib); };
    s.onerror=()=>{ clearTimeout(timer); rej(new Error('当前离线，无法加载 PDF 组件')); };
    document.head.appendChild(s);
  }).catch(e=>{ pdfLibPromise=null; throw e; });
  return pdfLibPromise;
}
async function parsePdfOnline(buf){
  const lib=await loadPdfLib();
  const pdf=await lib.getDocument({data:new Uint8Array(buf),useSystemFonts:true}).promise;
  const max=Math.min(pdf.numPages,60), lines=[];
  for(let i=1;i<=max;i++){
    const page=await pdf.getPage(i);
    const tc=await page.getTextContent();
    let cur='';
    (tc.items||[]).forEach(it=>{
      cur+=(it.str||'');
      if(it.hasEOL){ if(cur.trim()) lines.push(cur.trim()); cur=''; }
    });
    if(cur.trim()) lines.push(cur.trim());
    lines.push('');
  }
  return lines;
}
async function inflateZlib(bytes){
  const ds=new DecompressionStream('deflate');
  const st=new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(st).arrayBuffer());
}
/* 很多 PDF（如 reportlab 生成）用 ASCII85Decode + FlateDecode 双重编码 */
function ascii85Decode(str){
  const out=[], t=[0,0,0,0,0]; let n=0;
  const push=v=>{
    let acc=t[0]*52200625+t[1]*614125+t[2]*7225+t[3]*85+t[4], len=4;
    if(n<5){ len=4-(5-n); for(let k=n;k<5;k++){ t[k]=84; acc=t[0]*52200625+t[1]*614125+t[2]*7225+t[3]*85+t[4]; } }
    out.push(Math.floor(acc/16777216)%256,Math.floor(acc/65536)%256,Math.floor(acc/256)%256,acc%256);
    if(len<4) out.length-=(4-len);
    n=0;
  };
  for(let i=0;i<str.length;i++){
    const c=str[i];
    if(c==='~') break;
    if(/\s/.test(c)) continue;
    if(c==='z'&&n===0){ out.push(0,0,0,0); continue; }
    const v=c.charCodeAt(0)-33;
    if(v<0||v>84) continue;
    t[n++]=v; if(n===5) push();
  }
  if(n>1) push();
  return new Uint8Array(out);
}
function pdfLiterals(str){
  const res=[]; let depth=0,buf='';
  for(let i=0;i<str.length;i++){
    const c=str[i];
    if(c==='\\'){ if(depth>0) buf+=c+(str[++i]||''); continue; }
    if(c==='('){ depth++; if(depth>1) buf+=c; continue; }
    if(c===')'){ depth--; if(depth===0) res.push(buf); else buf+=c; continue; }
    if(depth>0) buf+=c;
  }
  return res;
}
function pdfUnescape(s){
  let out='';
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c!=='\\'){ out+=c; continue; }
    const n=s[++i];
    if(n==='n') out+='\n'; else if(n==='r') out+=''; else if(n==='t') out+=' ';
    else if(n==='f') out+=' '; else if(n==='b') out+='';
    else if(/[0-7]/.test(n)){ let o=n;
      while(o.length<3 && /[0-7]/.test(s[i+1]||'')) o+=s[++i];
      out+=String.fromCharCode(parseInt(o,8)); }
    else if(n==='\n'||n==='\r'){} else out+=n;
  }
  return out;
}
async function parsePdfLocal(buf){
  if(typeof DecompressionStream==='undefined') throw new Error('浏览器不支持离线解析 PDF');
  const u8=new Uint8Array(buf), latin=new TextDecoder('latin1').decode(u8);
  const re=/(?<!end)stream\r?\n/g; let m, lines=[],streams=0;
  while((m=re.exec(latin)) && streams<400){
    const start=m.index+m[0].length, end=latin.indexOf('endstream',start);
    if(end<0) break;
    re.lastIndex=end+9;
    const ds=latin.lastIndexOf('<<',m.index);
    const head=latin.slice(ds>-1?ds:Math.max(0,m.index-600),m.index);
    if(/\/Image\b|\/ObjStm\b|\/XObject\b/.test(head)) continue;
    let content;
    try{
      let bytes=u8.subarray(start,end);
      if(/\/ASCII85Decode/.test(head)) bytes=ascii85Decode(latin.slice(start,end));
      if(/\/FlateDecode/.test(head)) content=new TextDecoder('latin1').decode(await inflateZlib(bytes));
      else content=new TextDecoder('latin1').decode(bytes);
    }catch(e){ continue; }
    if(!/\bTj\b|\bTJ\b/.test(content)) continue;
    streams++;
    const blocks=content.match(/BT[\s\S]*?ET/g)||[content];
    blocks.forEach(b=>{
      let line='';
      const tk=/\((?:\\.|[^\\()])*\)\s*(?:Tj|')|\[([\s\S]*?)\]\s*TJ|T\*|\bTd\b|\bTD\b/g;
      let t;
      while((t=tk.exec(b))){
        if(t[1]!==undefined){
          const parts=t[1].split(/(-?\d+(?:\.\d+)?)/);
          let seg='';
          parts.forEach(p=>{
            if(/^\s*-?\d+(\.\d+)?\s*$/.test(p)){ if(parseFloat(p)<-120) seg+=' '; }
            else seg+=pdfLiterals(p).map(pdfUnescape).join('');
          });
          line+=seg;
        }else if(/^\(/.test(t[0])) line+=pdfUnescape(pdfLiterals(t[0])[0]||'');
        else { if(line.trim()) lines.push(line.trim()); line=''; }
      }
      if(line.trim()) lines.push(line.trim());
    });
  }
  return lines;
}
function pdfQualityOK(paras){
  const j=paras.join(' ');
  if(j.length<40 || /\ufffd/.test(j)) return false;
  const letters=(j.match(/[A-Za-z]/g)||[]).length;
  return letters>=30 && letters/j.length>=0.45;
}
function withTimeout(p,ms){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('PDF 解析超时')),ms))]);
}
async function parsePdf(buf,file){
  let title='';
  try{
    const latin=new TextDecoder('latin1').decode(new Uint8Array(buf));
    const m=latin.match(/\/Title\s*\(((?:\\.|[^\\()])*)\)/);
    if(m){ const t=pdfUnescape(m[1]).trim(); if(t&&t.length<100) title=t; }
  }catch(e){}
  /* 先本机解析文字流：绝大多数文字型 PDF 不需要联网，也不依赖 worker */
  let local=[];
  try{ local=mergeWrappedLines(await parsePdfLocal(buf)).filter(Boolean); }catch(e){}
  if(pdfQualityOK(local)) return {paras:local,from:file.name+' · 本机解析',title:title};
  /* 本机结果不够好（扫描件 / CID 字体）时再联网用 pdf.js */
  let online=[],err='';
  try{ online=mergeWrappedLines(await withTimeout(parsePdfOnline(buf),20000)).filter(Boolean); }
  catch(e){ err=e.message||'解析失败'; }
  if(pdfQualityOK(online)) return {paras:online,from:file.name+' · PDF 文字层',title:title};
  const best=online.length>local.length?online:local;
  if(pdfQualityOK(best)) return {paras:best,from:file.name+' · 部分文字',title:title};
  throw new Error('没识别出可用的英文文字，可能是扫描版 PDF 或特殊嵌入字体'+
    (err?'（联网解析：'+err+'）':'')+'。建议先 OCR，或另存为 .txt / .docx 后导入');
}

/* ---------- 统一入口 ---------- */
async function parseFile(file){
  const name=file.name||'untitled';
  const ext=((name.match(/\.([^.]+)$/)||[])[1]||'').toLowerCase();
  const buf=await file.arrayBuffer();
  let r;
  if(ext==='docx') r=await parseDocx(buf);
  else if(ext==='epub') r=await parseEpub(buf);
  else if(ext==='pdf') r=await parsePdf(buf,file);
  else if(ext==='html'||ext==='htm'){
    const raw=decodeText(buf), ps=htmlToParas(raw);
    let title='';
    const h=raw.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
    if(h){
      const t=h[1].replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
      if(t&&t.length<90){ title=t; if(ps[0]===t) ps.shift(); }
    }
    r={paras:ps,title:title};
  }
  else {
    const raw=decodeText(buf), h=raw.match(/^\s*#\s+(.+)\n/);
    const body=(h?raw.slice(h[0].length):raw)
      .replace(/^#{1,6}\s+/gm,'')
      .replace(/\[([^\]]+)\]\([^)]*\)/g,'$1')
      .replace(/\*\*|__|`/g,'');
    r={paras:splitParas(body,true),title:h?h[1].trim():''};
  }
  if(!r.paras||!r.paras.length) throw new Error('没有读到正文文字');
  const capped=capParas(r.paras);
  return {title:r.title||'',paras:capped.paras,truncated:capped.truncated,from:r.from||name};
}

function addArticle(meta){
  const a=Object.assign({id:'custom_'+Date.now().toString(36)+'_'+S.library.length,ts:Date.now()},meta);
  S.library.push(a);
  while(S.library.length>MAX_LIB){ const old=S.library.shift(); delete S.saved[old.id]; }
  saveLibrary(); buildArticleSelect(); loadArticle(a.id);
  return a;
}
async function importFiles(files,logEl,autoClose){
  const all=Array.from(files||[]), list=all.filter(f=>/\.(txt|text|md|markdown|html?|docx|epub|pdf)$/i.test(f.name||''));
  const skipped=all.filter(f=>!list.includes(f));
  if(!list.length){ toast('没有可导入的文件，支持 txt / md / html / docx / epub / pdf'); return []; }
  const log=(txt,cls)=>{ if(logEl){ logEl.innerHTML+='<div class="'+(cls||'')+'">'+txt+'</div>'; logEl.scrollTop=logEl.scrollHeight; } };
  const added=[];
  for(const f of list){
    log('⏳ 正在解析 '+esc(f.name),'wait');
    try{
      const r=await parseFile(f);
      const a=addArticle({
        title:r.title||f.name.replace(/\.[^.]+$/,''),
        sub:'导入自 '+r.from+(r.truncated?' · 已截断':'')+' · '+r.paras.length+' 段',
        paras:r.paras,from:f.name
      });
      added.push(a);
      log('✓ '+esc(f.name)+' → '+r.paras.length+' 段'+(r.truncated?'（篇幅过长已截断）':''),'ok');
    }catch(e){ log('✗ '+esc(f.name)+'：'+esc(e.message||'解析失败'),'bad'); }
  }
  skipped.forEach(f=>log('✗ '+esc(f.name)+'：暂不支持这个格式','bad'));
  if(added.length){
    toast('已导入 '+added.length+' 篇，可以直接划线了');
    if(autoClose) setTimeout(()=>{ if(!document.querySelector('#impLog .bad')) closeModal(); },900);
  }
  return added;
}

function buildMarkdown(){
  let out='# '+S.article.title+' · 划读笔记\n\n';
  out+='> '+S.article.sub+'　|　'+EXAMS[S.exam].name+'　|　'+S.marks.length+' 条标记　|　导出时间：'+new Date().toLocaleString('zh-CN')+'\n\n';
  S.marks.forEach((m,i)=>{
    const raw=S.results[m.id], r=raw&&!raw.error?raw:(raw&&raw.fallback);
    out+='## '+(i+1)+'. ['+TYPES[m.type]+'] '+m.text+'\n\n';
    out+='原句：'+m.ctx+'\n\n';
    if(!r){ out+='---\n\n'; return; }
    if(r.translation) out+='**'+(m.type==='sentence'?'整句翻译':'所在句译文')+'**：'+r.translation+'\n\n';
    if(m.type==='sentence'){
      if(r.structure&&r.structure.length){ out+='**句子结构**\n\n'; r.structure.forEach(x=>out+='- '+x+'\n'); out+='\n'; }
      if(r.grammar&&r.grammar.length){ out+='**语法与搭配**\n\n'; r.grammar.forEach(x=>out+='- '+x+'\n'); out+='\n'; }
      const sim=r.similar, isArr=Array.isArray(sim);
      const mine=isArr?[]:((sim&&sim.inArticle)||[]), ex=isArr?(sim||[]):((sim&&sim.examples)||[]);
      if(mine.length||ex.length){
        out+='**同类例举**\n\n';
        if(!isArr&&sim.tags) out+='识别到的结构：'+sim.tags.join(' / ')+'\n\n';
        mine.forEach(x=>out+='- [本文] '+x.en+'\n  - '+x.note+'\n');
        ex.forEach(x=>out+='- '+x.en+'\n  - '+(x.zh||'')+' '+(x.point||'')+'\n');
        out+='\n';
      }
    }else if(m.type==='phrase'){
      if(r.meaning||r.ptype) out+='**释义**：'+(r.ptype?'['+r.ptype+'] ':'')+(r.meaning||'')+'\n\n';
      if(r.collocations&&r.collocations.length){
        out+='**用法与常见搭配**\n\n'; r.collocations.forEach(x=>out+='- '+x+'\n'); out+='\n';
      }
      [['同族词组',r.family],['易混词组辨析',r.confusables]].forEach(g=>{
        if(!g[1]||!g[1].length)return;
        out+='**'+g[0]+'**\n\n';
        g[1].forEach(x=>out+='- **'+(x.phrase||x.word||x.w||x.term||'')+'** — '+(x.diff||x.meaning||'')+(x.example?'　*'+x.example+'*':'')+'\n');
        out+='\n';
      });
      if(r.examples&&r.examples.length){
        out+='**例句**\n\n'; r.examples.forEach(x=>out+='- '+x.en+(x.zh?'　'+x.zh:'')+'\n'); out+='\n';
      }
      if(r.notes&&r.notes.length){ out+='**结构线索**\n\n'; r.notes.forEach(x=>out+='- '+x+'\n'); out+='\n'; }
    }else{
      if(r.words&&r.words.length){
        out+='**词义**\n\n';
        r.words.forEach(w=>{ out+='- **'+(w.term||'')+'** '+(w.phonetic||'')+' '+(w.pos||'')+' — '+(w.meaning||'')+(w.example?'　*'+w.example+'*':'')+'\n'; });
        out+='\n';
      }
      if(r.notes&&r.notes.length){ out+='**构词与搭配线索**\n\n'; r.notes.forEach(x=>out+='- '+x+'\n'); out+='\n'; }
      if(r.synSet){
        out+='**近义词辨析 · 课堂式**\n\n';
        (r.synSet.words||[]).forEach((x,i)=>{ out+='- '+(i+1)+'. **'+(x.word||'')+'** — '+(x.diff||'')+(x.example?'　*'+x.example+'*':'')+'\n'; });
        out+='\n';
        const ex=r.synSet.exam;
        if(ex&&ex.q){
          out+='> ['+(ex.tag||'真题考点')+'] '+ex.q+'\n> 答案：**'+(ex.answer||'')+'**'+(ex.why?'　'+ex.why:'')+'\n\n';
        }
      }
      const groups=[['派生词 · 同族词',r.derivatives]].concat(r.synSet?[]:[['近义词辨析',r.synonyms]]).concat([['近形词辨析 · 易混',r.confusables]]);
      groups.forEach(g=>{
        if(!g[1]||!g[1].length)return;
        out+='**'+g[0]+'**\n\n';
        g[1].forEach(x=>out+='- **'+(x.word||x.w||x.term||'')+'** '+(x.pos||'')+' — '+(x.meaning||x.diff||'')+(x.example||x.ex?'　*'+(x.example||x.ex)+'*':'')+'\n');
        out+='\n';
      });
      if(r.lookalikes&&r.lookalikes.length){
        out+='**形近词联想 · 一起记**\n\n';
        'ABCDE'.split('').forEach((L,i)=>{ const x=r.lookalikes[i]; if(x) out+='- '+L+'. **'+(x.word||'')+'** — '+(x.hint||'')+'\n'; });
        out+='\n';
      }
    }
    const xm=r.examExtras||{}, xmode=(r.examMode||S.exam), xsecs=EXAM_SECTIONS[xmode]||[];
    if(xsecs.length){
      let any=false, ex='';
      xsecs.forEach(s=>{ const v=xm[s.k];
        if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length))return; any=true;
        ex+='**'+s.t+'**\n\n';
        if(Array.isArray(v)) v.forEach(e=>{
          if(typeof e==='string') ex+='- '+e+'\n';
          else ex+='- '+(e.word||e.a||'')+(e.diff?' — '+e.diff:'')+(e.b?' → '+e.b:'')+(e.example?'　*'+e.example+'*':'')+(e.note?'　'+e.note:'')+'\n';
        });
        else if(typeof v==='object') ex+='> '+(v.q||'')+'\n> 答案：**'+(v.answer||'')+'**'+(v.why?'　'+v.why:'')+'\n';
        else ex+=v+'\n';
        ex+='\n';
      });
      if(any) out+='### '+EXAMS[xmode].name+' · 专属讲解模块\n\n'+ex;
    }
    if(r.tip) out+='**提示**：'+r.tip+'\n\n';
    (S.followups[m.id]||[]).forEach(f=>{ out+='> 问：'+f.q+'\n> 答：'+(f.a||'')+'\n\n'; });
    out+='---\n\n';
  });
  return out;
}
/* ---------- 导出：Word(.docx) / PDF / Markdown，均纯前端生成 ---------- */
function xmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function docxRun(t,b,i){
  if(!t) return '';
  return '<w:r>'+((b||i)?'<w:rPr>'+(b?'<w:b/>':'')+(i?'<w:i/>':'')+'</w:rPr>':'')+'<w:t xml:space="preserve">'+xmlEsc(t)+'</w:t></w:r>';
}
function docxRich(text){
  let out='',re=/\*\*([^*]+)\*\*|\*([^*]+)\*/g,last=0,m;
  while((m=re.exec(text))){
    out+=docxRun(text.slice(last,m.index));
    out+=(m[1]!==undefined)?docxRun(m[1],true):docxRun(m[2],false,true);
    last=m.index+m[0].length;
  }
  return out+docxRun(text.slice(last));
}
function docxPara(line){
  if(!line.trim()) return '<w:p/>';
  if(line==='---') return '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:color="BFC9D4"/></w:pBdr></w:pPr></w:p>';
  let style='',text=line,ind=0;
  if(line.startsWith('## ')){style='Heading2';text=line.slice(3);}
  else if(line.startsWith('# ')){style='Heading1';text=line.slice(2);}
  else if(line.startsWith('> ')){style='Quote';text=line.slice(2);}
  else if(/^\s*-\s+/.test(line)){style='ListParagraph';text='• '+line.replace(/^\s*-\s+/,'');ind=/^\s{2,}/.test(line)?360:0;}
  const pPr='<w:pPr>'+(style?'<w:pStyle w:val="'+style+'"/>':'')+(ind?'<w:ind w:left="'+ind+'" w:hanging="300"/>':'')+'</w:pPr>';
  return '<w:p>'+pPr+docxRich(text)+'</w:p>';
}
function crc32(buf){
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++){
    let c=(crc^buf[i])&255;
    for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    crc=(crc>>>8)^c;
  }
  return (crc^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const nb=enc.encode(f[0]),fb=enc.encode(f[1]),crc=crc32(fb);
    const local=[].concat(u32(0x04034b50),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(fb.length),u32(fb.length),u16(nb.length),u16(0),Array.from(nb),Array.from(fb));
    parts.push(new Uint8Array(local));
    central.push([].concat(u32(0x02014b50),u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(fb.length),u32(fb.length),u16(nb.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(off),Array.from(nb)));
    off+=local.length;
  });
  const start=off;let cdLen=0;
  central.forEach(c=>{parts.push(new Uint8Array(c));cdLen+=c.length;});
  parts.push(new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cdLen),u32(start),u16(0))));
  let total=0;parts.forEach(p=>total+=p.length);
  const out=new Uint8Array(total);let p=0;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function buildDocxBytes(){
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const body=buildMarkdown().split('\n').map(docxPara).join('');
  const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="'+W+'"><w:body>'+body+
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709"/></w:sectPr></w:body></w:document>';
  const styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="'+W+'">'+
    '<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Microsoft YaHei"/><w:sz w:val="21"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="100" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>'+
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>'+
    '<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="200" w:after="160"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:color w:val="1F4E79"/><w:sz w:val="34"/></w:rPr></w:style>'+
    '<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="220" w:after="100"/><w:outlineLvl w:val="1"/></w:pPr><w:rPr><w:b/><w:color w:val="1F4E79"/><w:sz w:val="26"/></w:rPr></w:style>'+
    '<w:style w:type="paragraph" w:styleId="Quote"><w:name w:val="Quote"/><w:basedOn w:val="Normal"/><w:pPr><w:ind w:left="360"/><w:spacing w:after="80"/></w:pPr><w:rPr><w:i/><w:color w:val="666666"/></w:rPr></w:style>'+
    '<w:style w:type="paragraph" w:styleId="ListParagraph"><w:name w:val="List Paragraph"/><w:basedOn w:val="Normal"/><w:pPr><w:ind w:left="360" w:hanging="300"/></w:pPr></w:style>'+
    '</w:styles>';
  const ct='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>';
  const rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const drels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';
  return zipStore([['[Content_Types].xml',ct],['_rels/.rels',rels],['word/document.xml',doc],['word/_rels/document.xml.rels',drels],['word/styles.xml',styles]]);
}
function mdInline(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>'); }
function md2noteHTML(md){
  let h='',ul=false;
  const shut=()=>{ if(ul){h+='</ul>';ul=false;} };
  md.split('\n').forEach(line=>{
    if(line.startsWith('## ')){shut();h+='<h2>'+mdInline(line.slice(3))+'</h2>';}
    else if(line.startsWith('# ')){shut();h+='<h1>'+mdInline(line.slice(2))+'</h1>';}
    else if(line==='---'){shut();h+='<hr>';}
    else if(line.startsWith('> ')){shut();h+='<blockquote>'+mdInline(line.slice(2))+'</blockquote>';}
    else if(/^\s*-\s+/.test(line)){if(!ul){h+='<ul>';ul=true;}h+='<li>'+mdInline(line.replace(/^\s*-\s+/,''))+'</li>';}
    else if(line.trim()){shut();h+='<p>'+mdInline(line)+'</p>';}
    else shut();
  });
  shut();return h;
}
function noteDocument(md){
  return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>划读笔记</title><style>'+
    '@page{size:A4;margin:18mm 16mm}'+
    'body{font:14px/1.75 "Microsoft YaHei","PingFang SC",Calibri,sans-serif;color:#222;max-width:820px;margin:0 auto;padding:18px}'+
    'h1{font-size:26px;color:#1F4E79;margin:0 0 8px;border-bottom:3px solid #1F4E79;padding-bottom:10px}'+
    'h2{font-size:17px;color:#1F4E79;margin:22px 0 8px;padding-left:10px;border-left:4px solid #1F4E79}'+
    'p{margin:6px 0}ul{margin:6px 0 10px;padding-left:24px}li{margin:3px 0}'+
    'blockquote{background:#f4f6f8;border-left:3px solid #9bb8d4;margin:6px 0;padding:6px 12px;color:#555}'+
    'hr{border:0;border-top:1px dashed #ccc;margin:18px 0}strong{color:#1F4E79}'+
    '@media print{body{padding:0}}'+
    '</style></head><body>'+md2noteHTML(md)+'</body></html>';
}
function saveBlob(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('已下载');
}
function exportPDF(){
  const w=window.open('','_blank');
  if(!w){toast('弹窗被拦截，请允许本站弹窗');return;}
  w.document.open();w.document.write(noteDocument(buildMarkdown()));w.document.close();
  setTimeout(()=>{try{w.focus();w.print();}catch(e){}},400);
  toast('打印窗口里选「另存为 PDF」');
}
function exportNotes(){
  const md=buildMarkdown();
  const base='划读笔记-'+S.article.title.replace(/[^\w\u4e00-\u9fa5]+/g,'-');
  openModal('<h3>导出精读笔记</h3><div class="body">'+
    '共 '+S.marks.length+' 条标记，含长难句结构与同类例举、词汇的派生词、课堂式近义词辨析（含真题语境）、近形词辨析与形近词联想、词组搭配、追问记录。<br>'+
    'Word 是可直接编辑的 .docx；PDF 会打开打印窗口，在目标里选「另存为 PDF」。<br>'+
    '<div class="export-pre" style="margin-top:12px">'+esc(md)+'</div>'+

  $('#copyMd').onclick=async()=>{
    try{ await navigator.clipboard.writeText(md); toast('已复制到剪贴板'); }
    catch(e){ const ta=document.createElement('textarea');ta.value=md;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制'); }
  };
  $('#dlMd').onclick=()=>saveBlob(new Blob([md],{type:'text/markdown;charset=utf-8'}),base+'.md');
  $('#dlDocx').onclick=()=>saveBlob(new Blob([buildDocxBytes()],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),base+'.docx');
  $('#dlPdf').onclick=()=>{closeModal();exportPDF();};
}

let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hidden'),2300);
}
window.addEventListener('resize',()=>{ sizeCanvas(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeModal(); return; }
  if(S.tab!=='cards') return;
  if(!$('#mask').classList.contains('hidden')) return;
  const tag=(e.target&&e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(e.code==='Space'||e.key===' '){ e.preventDefault(); flipCard(); }
  else if(e.key==='1'||e.key==='2'||e.key==='3'){ e.preventDefault(); gradeCard(+e.key); }
});

/* 整页拖放导入 */
const hasFiles=e=>!!(e.dataTransfer && Array.from(e.dataTransfer.types||[]).indexOf('Files')>-1);
let dragDepth=0;
document.addEventListener('dragenter',e=>{ if(!hasFiles(e))return; e.preventDefault(); dragDepth++; $('#dropZone').classList.remove('hidden'); });
document.addEventListener('dragover',e=>{ if(!hasFiles(e))return; e.preventDefault(); if(e.dataTransfer)e.dataTransfer.dropEffect='copy'; });
document.addEventListener('dragleave',e=>{ if(!hasFiles(e))return; dragDepth=Math.max(0,dragDepth-1); if(!dragDepth)$('#dropZone').classList.add('hidden'); });
document.addEventListener('drop',e=>{
  if(!hasFiles(e))return;
  e.preventDefault(); dragDepth=0; $('#dropZone').classList.add('hidden');
  const files=Array.from(e.dataTransfer.files||[]);
  if(!files.length) return;
  openModal('<h3>正在导入文件</h3><div class="body">'+
    '<div class="imp-log" id="impLog"></div>'+
    '<div class="foot"><button onclick="closeModal()">完成</button></div></div>');
  importFiles(files,$('#impLog'),false);
});

/* 本地 AI 桥自动接入：桥已启动、且用户从未配置过接口时，直接写好设置 */
async function autoDetectBridge(){
  if(S.cfg.key || S.cfg.base!=='https://api.openai.com/v1') return;
  try{
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),1000);
    const res=await fetch('http://127.0.0.1:8787/',{signal:ctl.signal});
    clearTimeout(timer);
    if(!res.ok) return;
    const j=await res.json();
    if(!j.ok || !/已设置/.test(j.key||'')) return;
    S.cfg={base:'http://127.0.0.1:8787/v1',key:'local-bridge',model:'glm-4-flash'};
    saveState(); renderSide();
    toast('已自动接入本地 AI 桥 · glm-4-flash');
  }catch(e){}
}
